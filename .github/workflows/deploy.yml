name: Deploy PWA to GitHub Pages

# Everything the app needs is built here rather than committed: the Rust bridge is
# generated from the crate, and the four core binaries are build outputs from
# third-party GPL/LGPL sources that this repository deliberately does not vendor.
# A checkout on its own is therefore not deployable — this workflow is the only
# thing that produces a complete `web/`.

on:
  push:
    branches: [master]
  # Lets a deploy be re-run from the Actions tab without needing a commit, which
  # matters when the only device to hand is a phone.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one in flight: a half-finished Pages
# deployment is worse than a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- Rust toolchain -----------------------------------------------------
      # The version comes from rust-toolchain.toml, not from this file — see the comment
      # there for why it is pinned rather than floating on `stable`. rustup reads that
      # file for every cargo invocation in the repository, so nothing below needs to name
      # a toolchain. The `target add` calls are redundant with the file's `targets` key
      # and kept anyway: they are idempotent, and they mean the build does not depend on
      # which rustup version the runner happens to ship.
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown
          rustc --version
          cargo clippy --version

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      # wasm-bindgen-cli must match the wasm-bindgen version in Cargo.lock exactly
      # or the generated glue will not load. Cached because building it from source
      # takes minutes and it only changes when the lockfile does.
      - name: Cache wasm-bindgen-cli
        id: cache-bindgen
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Install wasm-bindgen-cli
        if: steps.cache-bindgen.outputs.cache-hit != 'true'
        run: |
          VERSION=$(sed -n '/^name = "wasm-bindgen"$/,/^version/ s/^version = "\(.*\)"/\1/p' Cargo.lock | head -1)
          echo "Cargo.lock wants wasm-bindgen $VERSION"
          cargo install wasm-bindgen-cli --version "$VERSION" --locked

      # --- The engine ---------------------------------------------------------
      - name: Build the Rust bridge
        run: ./scripts/build-wasm.sh

      # --- The cores ----------------------------------------------------------
      # build-core.sh fetches wasi-sdk into .tools/ on first run (~150 MB
      # compressed). Cached on the script's own hash, so changing a compiler flag
      # re-fetches rather than silently reusing a toolchain the flags no longer suit.
      - name: Cache wasi-sdk
        uses: actions/cache@v4
        with:
          path: .tools
          key: wasi-sdk-${{ runner.os }}-${{ hashFiles('scripts/build-core.sh') }}
          restore-keys: wasi-sdk-${{ runner.os }}-

      - name: Build all four libretro cores
        run: ./scripts/build-core.sh all

      # --- The test carts -----------------------------------------------------
      # The carts are committed, so regenerating them changes nothing in the artifact.
      # It is worth doing as a check that the generators still run on a clean machine
      # and that each committed cart still matches the source that claims to produce
      # it. Drift is a warning, not a failure: a cosmetic byte-difference should not
      # stop a deploy whose whole purpose is letting someone test on a phone.
      - name: Regenerate the test carts and verify they match the repository
        run: |
          # Three of the four are pure Python with no toolchain at all, so a failure
          # here is a real regression and should fail the build.
          python3 scripts/make-test-rom.py
          python3 scripts/make-sms-rom.py
          python3 scripts/make-snes-rom.py

          # The GBA cart compiles C and ARM assembly, so it needs an ARM-capable clang
          # plus ld.lld and llvm-objcopy.
          #
          # It must NOT use the wasi-sdk clang unpacked above. That LLVM is built with
          # the WebAssembly backend only and rejects the ARM codegen flags outright
          # ("Unknown command line argument '-arm-add-build-attributes'"), which is
          # what failed the first run of this workflow. Ubuntu's own clang has every
          # target; only the binutils replacements need locating, and Ubuntu ships
          # those under versioned names that the script does not know about.
          sudo apt-get update -qq && sudo apt-get install -y -qq lld llvm || true
          mkdir -p "$RUNNER_TEMP/bin"
          for tool in ld.lld llvm-objcopy; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              versioned=$(ls /usr/bin/"$tool"-* 2>/dev/null | sort -V | tail -1 || true)
              if [ -n "$versioned" ]; then
                ln -sf "$versioned" "$RUNNER_TEMP/bin/$tool"
                echo "aliased $tool -> $versioned"
              fi
            fi
          done
          export PATH="$RUNNER_TEMP/bin:$PATH"

          # Tolerated rather than required: the committed cart is what ships either
          # way, and a missing host binutils should not block the deploy.
          if ./scripts/make-gba-rom.sh; then
            echo "GBA cart regenerated"
          else
            echo "::warning::could not regenerate the GBA cart; using the committed one"
          fi

          if ! git diff --quiet -- web/roms/; then
            echo "::warning::a regenerated cart differs from the committed one (see below)"
            git diff --stat -- web/roms/
          else
            echo "all regenerated carts are byte-identical to the repository"
          fi

          # Restore the committed carts before anything is packaged.
          #
          # This step is a check, not a build, and its output must not be what ships:
          # the GBA cart is compiled, so a different clang version produces different
          # bytes, and this runner's are bytes no test has ever run. The committed
          # carts are the ones scripts/core-abi-test.mjs verifies.
          git checkout -- web/roms/

      # --- Sanity check before publishing -------------------------------------
      # Pages will happily deploy a half-built directory. This is the difference
      # between a failed build and a site that loads and then cannot launch anything.
      - name: Verify the build is complete
        run: |
          fail=0
          for f in web/vendor/bridge/emulator_bridge.js \
                   web/vendor/bridge/emulator_bridge_bg.wasm \
                   web/cores/fceumm.wasm \
                   web/cores/mgba.wasm \
                   web/cores/genesis_plus_gx.wasm \
                   web/cores/snes9x.wasm; do
            if [ -s "$f" ]; then
              printf '  ok    %-48s %s\n' "$f" "$(du -h "$f" | cut -f1)"
            else
              printf '  MISSING %s\n' "$f"; fail=1
            fi
          done
          # The manifest's sizeBytes only drives the download progress bar, and
          # core-loader prefers the response's content-length when there is one — so a
          # stale value is a slightly wrong progress bar, not a broken app.
          #
          # Exact equality is not expected and never will be: some cores embed __FILE__
          # in assertion strings, so the absolute build path ends up in the binary and a
          # different machine produces a different length. Observed drift between this
          # runner and a dev sandbox is a few tens of bytes. Only a real change in
          # magnitude is worth reporting.
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("web/cores/manifest.json", "utf8"));
            for (const c of m.cores.filter((c) => c.kind === "libretro")) {
              const actual = fs.statSync("web/cores/" + c.id + ".wasm").size;
              const drift = Math.abs(actual - c.sizeBytes) / c.sizeBytes;
              if (drift > 0.01) {
                console.log(`::warning::manifest sizeBytes for ${c.id} is ${c.sizeBytes} but the build is ${actual} (${(drift * 100).toFixed(1)}% off)`);
              }
            }
          '
          exit $fail

      # The cores this runner just built are not the ones tested on a dev machine — they
      # are compiled by a different toolchain install, and at least two of them embed the
      # build path. So run the contract suite against these binaries: instantiate each
      # core, load its cart, and assert on the pixels, audio, input and save states that
      # come out. About a second, no browser and no GPU, and it is the difference between
      # deploying four cores and deploying four files.
      # Phase 5. The Switch wrapper and the Rust hardware-render seam are not part of the
      # web deploy, but they share this repository and would otherwise rot unnoticed: the
      # C++ needs the same libretro.h the cores use, and the Rust must keep compiling for
      # aarch64-apple-ios. Both are cheap and neither touches the packaged output.
      - name: Build and test the native Switch wrapper
        run: |
          ./native/switch-wrapper/build.sh host

      # `cargo check` for the iOS target is the gate that matters here: it catches real
      # breakage, and compile errors do not drift between compiler releases. The clippy
      # line is a style gate, and `-D warnings` is only defensible because the toolchain
      # is pinned — on a floating `stable` it fails the deploy whenever upstream adds a
      # lint. If this ever fails on code the commit did not touch, fix the pin or the
      # lint deliberately; do not reach for `--no-verify`.
      - name: Check the engine still compiles for iOS
        run: |
          rustup target add aarch64-apple-ios
          cargo check --target aarch64-apple-ios --features native-core,uniffi-bindings
          cargo clippy --features native-core,uniffi-bindings --all-targets -- -D warnings

      - name: Verify the built cores actually emulate
        run: node scripts/core-abi-test.mjs

      # --- Cache busting ------------------------------------------------------
      # The service worker serves assets cache-first, so the shell cache has to be
      # keyed to the build or a reload after a deploy keeps serving the previous
      # build's JavaScript. Stamping the commit SHA makes `activate` drop the old
      # cache, and main.js reloads once when the new worker takes over.
      - name: Stamp the service worker cache version with the commit SHA
        run: |
          SHA="${GITHUB_SHA::12}"
          sed -i "s/^const VERSION = 'dev';/const VERSION = '${SHA}';/" web/sw.js
          grep -n "^const VERSION" web/sw.js
          grep -q "const VERSION = '${SHA}';" web/sw.js || {
            echo "::error::failed to stamp the service worker version"
            exit 1
          }

      # No `actions/configure-pages` step on purpose.
      #
      # Its only outputs are a base URL and origin, which nothing here uses — this is a
      # plain static upload, not a site generator that needs to bake in a path. What it
      # *did* do was fail the build: creating a Pages site needs a permission the
      # workflow token does not have, and it errors rather than warning when the site
      # does not exist yet.
      #
      #   Create Pages site failed. Error: Resource not accessible by integration
      #
      # Enabling Pages is therefore a one-time manual step, in
      # Settings → Pages → Build and deployment → Source: "GitHub Actions".
      # Until that is done the deploy job below fails while everything above it
      # succeeds, so the artifact is still built and the caches are still warm — a
      # re-run after flipping the setting takes a minute rather than ten.
      - name: Upload the web directory
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
