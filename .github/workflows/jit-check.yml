# The PSP and 3DS recompilers' own tests against Continuum's two-address code memory, on an Apple
# Silicon Mac (scripts/jit-check.sh). Started by hand only; it never builds the app.
name: JIT check

on:
  workflow_dispatch:
    inputs:
      which:
        description: "probe, ppsspp, dynarmic or all"
        default: all

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: brew install ninja sdl3 sdl3_ttf boost || true
      - name: Probe
        run: scripts/jit-check.sh probe
      - name: Telemetry (crash catcher, watchdog)
        if: always()
        run: scripts/jit-check.sh telemetry
      - name: Dynarmic (3DS CPU)
        if: inputs.which == 'all' || inputs.which == 'dynarmic'
        run: scripts/jit-check.sh dynarmic
      - name: PPSSPP (PSP)
        if: always() && (inputs.which == 'all' || inputs.which == 'ppsspp')
        run: scripts/jit-check.sh ppsspp
      - name: PPSSPP (PSP), the iPhone's masked memory layout
        if: always() && (inputs.which == 'all' || inputs.which == 'ppsspp-masked')
        env:
          PPSSPP_MASKED: "1"
          JIT_CHECK_DIR: ${{ github.workspace }}/.jit-check-masked
        run: scripts/jit-check.sh ppsspp
