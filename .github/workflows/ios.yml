name: iOS

# Builds the sideloadable .ipa. Separate from deploy.yml on purpose: that workflow ships the
# web app and must stay fast, and macOS runners cost ten times what Linux ones do.
#
# `workflow_dispatch` is the important trigger here, not `push`. The only machine this
# project is developed from is a phone, so being able to start a build from the Actions tab
# and come back to a downloadable artefact *is* the build system.
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "native/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "scripts/fetch-libretro-headers.sh"
      # The script that builds and verifies every core. Its absence here was a real gap: a
      # change to the core build did not start a build, so it could only be tested by
      # remembering to dispatch one by hand. Listed rather than globbing scripts/**, because
      # the rest of that directory generates test ROMs and cannot affect the .ipa, and a macOS
      # runner costs ten times a Linux one.
      - "scripts/build-core.sh"
      - ".github/workflows/ios.yml"

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

# `contents: write` so the build can publish a Release. Spelled out because the default for a
# workflow token is read-only on many repositories, and a release step that cannot write fails at
# the very end of a long macOS build.
permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-latest
    # Raised from 60 when the build went from compiling one native libretro core to several, one of
    # which (mgba) is an LTO CMake build plus a whole-archive link, and one of which
    # (pcsx_rearmed) is a full-depth clone with recursive submodules. Nothing here is cached
    # between runs except cargo. A timeout is the worst failure this job has: it produces no
    # artefact and no ::error:: annotation, so it reads like an infrastructure hang rather than
    # a build that simply needed longer. The job is billed by the minute either way.
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      # Everything about the runner that could explain a failure, printed before anything
      # can fail. Nobody on this project can reproduce a macOS build locally, so the log is
      # the only diagnostic that exists.
      - name: Runner and toolchain versions
        run: |
          sw_vers
          echo "--- selected Xcode ---"
          xcode-select -p
          xcodebuild -version
          echo "--- available SDKs ---"
          xcodebuild -showsdks | sed -n '/iOS/,/^$/p' || true
          echo "--- clang ---"
          clang++ --version | head -2

      - name: Install the pinned Rust toolchain
        run: |
          # Version, components and targets all come from rust-toolchain.toml — the same
          # pin the Linux workflow uses, so the engine in the .ipa is built by the compiler
          # everything else was verified with.
          rustup toolchain install
          rustup target add aarch64-apple-ios
          rustc --version
          cargo --version

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ios-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ios-cargo-${{ runner.os }}-

      - name: Install XcodeGen and make sure CMake is present
        run: |
          # The .xcodeproj is generated from native/ios/project.yml rather than committed,
          # because a UUID-keyed pbxproj cannot be reviewed in a diff — and this project has
          # no Xcode to edit one with.
          brew install xcodegen
          xcodegen --version
          # The mgba core has no makefile: its libretro target is CMake, so the iOS core build
          # needs cmake on the host. The runner image ships it, which is exactly why this is a
          # conditional check rather than an unconditional install: it costs nothing today and
          # removes a whole failure class if a future image drops it.
          command -v cmake >/dev/null 2>&1 || brew install cmake
          cmake --version

      - name: Fetch the libretro headers
        run: |
          # build.sh normally takes libretro.h from the libretro-common vendored inside the
          # core sources, which only exist after a wasi-sdk core build. This runner does not
          # do that, so the headers are fetched. Hand-declaring them is what put two errors
          # in the design document last time.
          ./scripts/fetch-libretro-headers.sh

      - name: Build the engine, the wrapper and the UniFFI bindings
        run: ./native/ios/build-engine.sh

      - name: Show the generated Swift interface
        run: |
          # The generated facade is not committed, so this is the only place its shape is
          # visible. Worth having in the log when a Swift call site disagrees with Rust.
          echo "--- files ---"
          ls -la native/ios/build/Generated
          echo "--- public API surface ---"
          grep -hE "^\s*(public func|public class|public struct|public enum|open func)" \
            native/ios/build/Generated/*.swift | sed 's/^\s*/  /' | sort -u || true

      - name: Package the unsigned .ipa
        run: ./native/ios/package-ipa.sh

      # Fails the job rather than uploading nothing, so a green tick always means there is
      # an installable file at the end of it.
      - name: Verify the .ipa
        run: |
          IPA=native/ios/build/Continuum.ipa
          [ -f "$IPA" ] || { echo "::error::no .ipa was produced"; exit 1; }

          SIZE=$(stat -f%z "$IPA")
          echo "size: $SIZE bytes"
          [ "$SIZE" -gt 100000 ] || { echo "::error::.ipa is implausibly small ($SIZE bytes)"; exit 1; }

          # The things that make it installable and useful, checked individually. Each core
          # gets its own message naming the system that would not run, because "the .ipa is
          # fine" has to mean "every system in the Library can actually be launched".
          unzip -l "$IPA" | grep -q "Payload/Continuum.app/Continuum" \
            || { echo "::error::no executable at Payload/Continuum.app/Continuum"; exit 1; }
          unzip -l "$IPA" | grep -q "Payload/Continuum.app/Info.plist" \
            || { echo "::error::no Info.plist in the bundle"; exit 1; }
          unzip -l "$IPA" | grep -q "libcontinuum_switch.dylib" \
            || { echo "::error::the libretro wrapper is not embedded; the app would launch and fail to load a core"; exit 1; }
          unzip -l "$IPA" | grep -q "fceumm_libretro_ios.dylib" \
            || { echo "::error::the NES core is not embedded; .nes files would list in the Library and fail to launch"; exit 1; }
          unzip -l "$IPA" | grep -q "mgba_libretro_ios.dylib" \
            || { echo "::error::the GBA/GB/GBC core is not embedded; .gba, .gb and .gbc files would list in the Library and fail to launch"; exit 1; }
          unzip -l "$IPA" | grep -q "genesis_plus_gx_libretro_ios.dylib" \
            || { echo "::error::the Mega Drive/Master System/Game Gear core is not embedded; .md, .gen, .sms and .gg files would list in the Library and fail to launch"; exit 1; }
          unzip -l "$IPA" | grep -q "snes9x_libretro_ios.dylib" \
            || { echo "::error::the SNES core is not embedded; .sfc and .smc files would list in the Library and fail to launch"; exit 1; }
          unzip -l "$IPA" | grep -q "melonds_libretro_ios.dylib" \
            || { echo "::error::the DS core is not embedded; .nds files would list in the Library and fail to launch"; exit 1; }
          unzip -l "$IPA" | grep -q "mednafen_pce_fast_libretro_ios.dylib" \
            || { echo "::error::the TurboGrafx-16 core is not embedded; .pce files would list in the Library and fail to launch"; exit 1; }
          unzip -l "$IPA" | grep -q "stella2023_libretro_ios.dylib" \
            || { echo "::error::the Atari 2600 core is not embedded; .a26 files would list in the Library and fail to launch"; exit 1; }
          unzip -l "$IPA" | grep -q "pcsx_rearmed_libretro_ios.dylib" \
            || { echo "::error::the PS1 core is not embedded; the app would launch and fail to load PCSX ReARMed"; exit 1; }
          echo "ipa verified"

      - name: Upload the .ipa
        uses: actions/upload-artifact@v4
        with:
          name: Continuum-ipa-${{ github.sha }}
          path: native/ios/build/Continuum.ipa
          if-no-files-found: error
          retention-days: 30

      # THE INSTALLABLE COPY, and the artifact above is not one.
      #
      # An Actions artifact can only be downloaded by something that can authenticate as a logged-in
      # GitHub user. It arrives as a zip containing the .ipa, and no on-device signing tool can
      # fetch one from a URL. That is why installing has meant opening the Actions page, downloading
      # a zip, unzipping it and importing by hand, every single time.
      #
      # A Release asset on a public repository is plain unauthenticated HTTPS, so ESign and Feather
      # can pull it straight down. More usefully, GitHub keeps a permanent redirect at
      # /releases/latest/download/<asset>, which always resolves to the newest release's copy. So
      # ONE bookmarked link installs whatever the latest build is, with no repository browsing at
      # all. The asset name has to stay exactly `Continuum.ipa` for that URL to keep working.
      #
      # A tag per run rather than one reused tag, because build history has already been worth
      # having: when the app would not open, the question "does an older build still open" was the
      # one that would have separated a code fault from a signing fault, and that needs older
      # builds to still be reachable.
      #
      # Not marked prerelease. `releases/latest` SKIPS prereleases, which would quietly break the
      # bookmarked link.
      - name: Publish the .ipa as a Release
        if: success() && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="build-${{ github.run_number }}-$(echo '${{ github.sha }}' | cut -c1-7)"
          LATEST="https://github.com/${{ github.repository }}/releases/latest/download/Continuum.ipa"
          # Notes via a FILE rather than an inline --notes string. The text wants blank lines and
          # backticks, and both are hazards inside a shell argument in a YAML block scalar; a heredoc
          # quoted with <<'EOF' passes them through untouched with no escaping to get wrong.
          cat > /tmp/notes.md <<'EOF'
          Press **Continuum.ipa** below to download it, then import it into ESign or Feather and sign
          it with your certificate.

          **Bookmark this instead of browsing here:** it always redirects to the newest build.
          EOF
          echo "$LATEST" >> /tmp/notes.md
          printf '\nBuilt from %s on %s.\n' "${{ github.sha }}" "${{ github.ref_name }}" >> /tmp/notes.md
          # No --latest flag: a non-prerelease, non-draft release is already what
          # /releases/latest resolves to, and the flag is recent enough that relying on it would
          # risk failing this step at the very end of a long build for no gain.
          gh release create "$TAG" \
            native/ios/build/Continuum.ipa \
            --title "Continuum build ${{ github.run_number }}" \
            --notes-file /tmp/notes.md
          echo "released $TAG with Continuum.ipa"
          echo "always-newest link: $LATEST"

      # Written to the run's SUMMARY rather than only to the log, because the summary renders as a
      # page with tappable links on a phone while a log line is text to be copied by hand.
      - name: Say how to install it
        if: success() && github.ref == 'refs/heads/master'
        run: |
          set -euo pipefail
          REPO="https://github.com/${{ github.repository }}"
          LATEST="$REPO/releases/latest/download/Continuum.ipa"
          {
            echo "## Install this build"
            echo
            echo "**[Download Continuum.ipa]($LATEST)** — this link always gives the newest build, so it is the one to bookmark."
            echo
            echo "Then import it into ESign or Feather and sign it with your certificate."
            echo
            echo "### Deep links, if your signer supports them"
            echo
            echo "These open the signing app directly. NOT VERIFIED on a device yet, so if one of them"
            echo "does nothing, use the download link above and import by hand, and say which failed."
            echo
            echo "- ESign: \`esign://install?url=$LATEST\`"
            echo "- Feather: \`feather://install?url=$LATEST\`"
            echo
            echo "Built from \`${{ github.sha }}\`."
          } >> "$GITHUB_STEP_SUMMARY"

      # Uploaded separately because when something *does* go wrong on device, this is what
      # says why: the entitlements that were embedded and the generated Swift that was
      # compiled. Both are build outputs that exist nowhere else.
      - name: Upload build metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-metadata-${{ github.sha }}
          path: |
            native/ios/build/Generated/
            native/ios/project.yml
            native/ios/build/lib/core-sources.txt
          if-no-files-found: warn
          retention-days: 14
