name: iOS

# Builds the sideloadable .ipa, the only build this project has. The checks that need no Mac run
# first on Linux, because macOS runners cost ten times what Linux ones do.
#
# `workflow_dispatch` is the important trigger here, not `push`. The only machine this
# project is developed from is a phone, so being able to start a build from the Actions tab
# and come back to a downloadable artefact *is* the build system.
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "native/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "scripts/fetch-libretro-headers.sh"
      # The script that builds and verifies every core. Its absence here was a real gap: a
      # change to the core build did not start a build, so it could only be tested by
      # remembering to dispatch one by hand. Listed rather than globbing scripts/**, so only the
      # scripts that build, fetch or check something in the .ipa start a run, and a macOS
      # runner costs ten times a Linux one.
      - "scripts/build-core.sh"
      # Downloads, checks and stages the prebuilt cores from the libretro buildbot, and prboom.wad.
      - "scripts/fetch-buildbot-cores.sh"
      # Fetches and checks the bundled Flash (Ruffle) and J2ME (J2meJS) players.
      - "scripts/fetch-players.sh"
      # Continuum patches applied to the pinned core checkouts during ios-all. A patch-only
      # change must rebuild the IPA the same way a build-core.sh change does.
      - "scripts/patches/**"
      # Fetches MoltenVK, which package-ipa.sh runs before generating the project. A change to the
      # pinned version or the extraction has to rebuild, for the same reason build-core.sh does.
      - "scripts/fetch-moltenvk.sh"
      # Builds libsmb2 for the phone and links it into the app. package-ipa.sh runs it before
      # xcodegen. A change to the pin or the flags has to rebuild.
      - "scripts/fetch-libsmb2.sh"
      # The Swift checkers the `checks` job runs before the .ipa. A change to one must run them,
      # or a broken checker would surface only on the next unrelated push and block that build.
      - "scripts/check-*.sh"
      # Except the weekly emulator-update checker, which the glob above also matches. It runs on
      # Linux in core-updates.yml, nothing in the .ipa uses it, and editing it must not start a
      # macOS build. A negative pattern only excludes what a positive one ABOVE it matched, so it
      # has to stay below the glob.
      - "!scripts/check-core-updates.sh"
      - "scripts/check-*.py"
      - "docs/samples/**"
      - "scripts/skin-check/**"
      - "scripts/player-check/**"
      - ".github/workflows/ios.yml"

# One build per branch at a time, and a second push QUEUES behind the running one rather than
# cancelling it. Cancelling used to throw away a ~30 minute macOS build part-way, so two pushes close
# together could leave the owner with no new app at all. GitHub keeps at most one pending run per
# group: a third push replaces the queued second one, never the build already running.
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: false

# `contents: write` so the build can publish a Release. Spelled out because the default for a
# workflow token is read-only on many repositories, and a release step that cannot write fails at
# the very end of a long macOS build.
permissions:
  contents: write

jobs:
  # The checks that need no Mac, on a Linux runner a tenth of the price, BEFORE the macOS build.
  # A failure here stops the run in minutes with the failing test named, instead of after a
  # ~30 minute .ipa build, or worse, letting a broken engine reach the phone.
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Reads the repository and nothing else; the write permission above is for the ipa job.
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned Rust toolchain
        run: |
          # The same pin as the ipa job (rust-toolchain.toml), so the tests run on the compiler
          # that builds the engine in the .ipa.
          rustup toolchain install
          rustc --version
          cargo --version

      - name: Tool versions
        run: |
          # The Swift checks compile with the runner image's own swiftc (preinstalled on
          # ubuntu-24.04), so its version is the first thing to compare if they fail here and
          # pass on a dev machine.
          swiftc --version
          node --version
          clang++ --version | head -1

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: checks-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: checks-cargo-${{ runner.os }}-

      - name: Rust tests
        run: cargo test --workspace --features emulator-bridge/native-core

      - name: Wrapper harness
        run: |
          # The libretro wrapper built for the host and driven by its harness, which exits non-zero
          # on any failed check, and build.sh runs under `set -e` with the harness as its last step.
          ./scripts/fetch-libretro-headers.sh
          ./native/switch-wrapper/build.sh host
          ./native/continuum-symbian/build.sh host

      - name: Skin checks (Swift)
        run: ./scripts/check-skins.sh

      - name: Player checks (Swift and node)
        run: ./scripts/check-players.sh

  ipa:
    needs: checks
    runs-on: macos-latest
    # Raised from 60, then from 120 when Azahar joined ios-all, then to 240 when PPSSPP
    # joined. Azahar is a full-depth clone with recursive submodules. PPSSPP is another
    # large C++ cmake build on top of the cores already here (mgba's CMake link,
    # pcsx_rearmed's submodules). Nothing is cached between runs
    # except cargo. A timeout is the worst failure this job has: it produces no artefact
    # and no ::error:: annotation, so it reads like an infrastructure hang rather than a
    # build that simply needed longer. The job is billed by the minute either way.
    # Raised to 300 when flycast (Dreamcast, built from source with glslang) joined ios-all as an
    # optional core. The prebuilt buildbot cores cost seconds, not minutes.
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v7

      # Everything about the runner that could explain a failure, printed before anything
      # can fail. Nobody on this project can reproduce a macOS build locally, so the log is
      # the only diagnostic that exists.
      - name: Runner and toolchain versions
        run: |
          sw_vers
          echo "--- selected Xcode ---"
          xcode-select -p
          xcodebuild -version
          echo "--- available SDKs ---"
          xcodebuild -showsdks | sed -n '/iOS/,/^$/p' || true
          echo "--- clang ---"
          clang++ --version | head -2

      - name: Install the pinned Rust toolchain
        run: |
          # Version, components and targets all come from rust-toolchain.toml — the same
          # pin the Linux workflow uses, so the engine in the .ipa is built by the compiler
          # everything else was verified with.
          rustup toolchain install
          rustup target add aarch64-apple-ios
          rustc --version
          cargo --version

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ios-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ios-cargo-${{ runner.os }}-

      - name: Install XcodeGen and make sure CMake is present
        run: |
          # The .xcodeproj is generated from native/ios/project.yml rather than committed,
          # because a UUID-keyed pbxproj cannot be reviewed in a diff — and this project has
          # no Xcode to edit one with.
          brew install xcodegen
          xcodegen --version
          # The mgba core has no makefile: its libretro target is CMake, so the iOS core build
          # needs cmake on the host. The runner image ships it, which is exactly why this is a
          # conditional check rather than an unconditional install: it costs nothing today and
          # removes a whole failure class if a future image drops it.
          command -v cmake >/dev/null 2>&1 || brew install cmake
          cmake --version

      - name: Fetch the libretro headers
        run: |
          # The wrapper's build.sh compiles against the pinned libretro-common headers this script
          # fetches into .work/hdr, so it cannot drift from the ABI the cores are built against.
          # Hand-declaring them is what put two errors in the design document last time.
          ./scripts/fetch-libretro-headers.sh

      # THE CORE CACHE, and the reason this is restore/save rather than one `actions/cache`
      # step.
      #
      # Building the 35 emulator cores is 35 of this job's ~40 minutes, on EVERY build,
      # including one that changed a line of documentation. Each core is pinned to an exact
      # upstream commit, so its dylib is a pure function of that commit, build-core.sh and
      # the patches, and can be kept between runs. build-core.sh only reuses one when its
      # provenance manifest says the dylib really was built from the pin (see
      # ios_core_is_cached), and CONTINUUM_CORE_CACHE=1 below is what switches that on.
      #
      # THE KEY is a prefix naming everything a core's dylib depends on besides its pin, then
      # this run's id:
      #
      #   ios-cores-<os>-<toolchain>-<build-core.sh + scripts/patches>-<run id>-<attempt>
      #
      # The patches are in it because a patch changes the output without changing any pin. The
      # toolchain is in it (the step below says what that covers) because a new Xcode changes
      # the output too. Without it, when the runner image moved to a new compiler, builds kept
      # shipping cores made by the old one until an unrelated edit flushed the cache, and that
      # unrelated commit then took the blame for whatever the new compiler broke. Changing any
      # of these starts a new prefix, nothing restores, and everything rebuilds, which is the
      # correct and safe behaviour.
      #
      # scripts/fetch-buildbot-cores.sh is deliberately NOT in it. Its cores are deleted and
      # downloaded again on every run and checked against their pinned sha256 (fetch_one), so a
      # cached copy of one never ships, and editing that script must not throw away the sixteen
      # cores built from source.
      #
      # WHY A NEW ENTRY EVERY TIME. Cache entries can never be updated. With one fixed key, a set
      # saved by a run where an optional core failed (flycast is the slow one) stayed without it
      # for good: every later run restored it, rebuilt the missing core, and could not store the
      # result. Now the restore takes the NEWEST entry under the prefix (restore-keys; the exact
      # key never exists yet, so cache-hit is never 'true' and nothing reads it), and a run that
      # built anything saves the completed set as a new entry, which the next run picks up. The
      # attempt number is in the key so a re-run can save too: it has the same run id.
      #
      # `actions/cache` saves in post-job cleanup, which only happens when the whole job
      # succeeded, and that is exactly the wrong moment here: a job that built all 35 cores
      # and then failed in xcodebuild or at the release step would save nothing, so the retry
      # would pay the 35 minutes all over again. That is the single most frustrating thing
      # about this build. Hence restore/save as separate steps, with the save placed
      # IMMEDIATELY AFTER the cores exist and before anything that might fail.
      #
      # Note it is NOT `if: always()`, which is what this was first written as and was wrong.
      # The save sits before xcodebuild, so a later failure cannot reach it and no `always()`
      # is needed for that case. All `always()` would add is saving when the core build ITSELF
      # failed or was cancelled, and a step stopped part-way can leave a half-written dylib next
      # to a manifest line that already names its pinned commit (the line is written when the
      # source is checked out, before the compile). The next run would trust that file and ship
      # it. A set is only ever saved from a build step that finished.

      # WHAT THE CORES ARE COMPILED WITH, as a short id for the key above. Everything here
      # changes a core's dylib without changing its pin, build-core.sh or a patch:
      #   - xcodebuild -version: Xcode, which is the clang and the iphoneos SDK every core uses;
      #   - cmake --version: mgba, azahar, ppsspp and flycast are CMake builds;
      #   - native/ios/build-engine.sh: it exports IPHONEOS_DEPLOYMENT_TARGET, which every core
      #     compile inherits.
      # Printed in full, so when a build unexpectedly rebuilds every core the log says why.
      # The whole prefix is made here once, so the restore and the save cannot disagree on it.
      - name: Fingerprint the core toolchain
        id: toolchain
        env:
          CORE_SOURCES_HASH: ${{ hashFiles('scripts/build-core.sh', 'scripts/patches/**', 'native/continuum-symbian/**') }}
        run: |
          set -euo pipefail
          FP="$RUNNER_TEMP/core-toolchain.txt"
          {
            xcodebuild -version
            cmake --version
            shasum -a 256 native/ios/build-engine.sh
          } > "$FP"
          cat "$FP"
          id="$(shasum -a 256 "$FP" | cut -c1-16)"
          prefix="ios-cores-${RUNNER_OS}-${id}-${CORE_SOURCES_HASH}-"
          echo "toolchain id: $id"
          echo "core cache prefix: $prefix"
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"

      - name: Restore the built cores
        id: core-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            native/ios/build/lib/*_libretro_ios.dylib
            native/ios/build/lib/core-sources.txt
          key: ${{ steps.toolchain.outputs.prefix }}${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ steps.toolchain.outputs.prefix }}

      - name: Build the engine, the wrapper and the UniFFI bindings
        env:
          # For scripts/fetch-buildbot-cores.sh: a prebuilt core or prboom.wad that had to come from
          # upstream, and matched its pinned sha256, is uploaded to the core-mirror-1 pre-release so
          # later builds no longer depend on upstream still serving it. Master builds only; a failed
          # upload is a warning. Uses this job's `contents: write`.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONTINUUM_MIRROR_UPLOAD: ${{ github.ref == 'refs/heads/master' && '1' || '0' }}
          # Reuse a staged core dylib when its manifest line still names its pinned commit.
          # Off unless set, so a build run by hand is unchanged.
          CONTINUUM_CORE_CACHE: "1"
        run: ./native/ios/build-engine.sh

      # Placed here, before anything that can fail, rather than guarded with `always()`:
      # see the long note above. If this job dies after this point the cores are already
      # cached, and a core build that did not finish never gets stored.
      #
      # Only when this run BUILT at least one core. build-core.sh's ios-all writes
      # cores-rebuilt.txt for each core it compiled at its pin, and the file does not exist when
      # every core was reused, so a run that only reused the cache adds no copy of what is
      # already there. It also does not exist after a CONTINUUM_UNPINNED=1 run: those cores can
      # never be reused, and saving them would make them the newest entry and cost the next
      # normal build a full rebuild. The `if` still implies success(), so this runs only after
      # the build step above succeeded.
      - name: Save the built cores
        if: hashFiles('native/ios/build/lib/cores-rebuilt.txt') != ''
        uses: actions/cache/save@v6
        with:
          path: |
            native/ios/build/lib/*_libretro_ios.dylib
            native/ios/build/lib/core-sources.txt
          key: ${{ steps.toolchain.outputs.prefix }}${{ github.run_id }}-${{ github.run_attempt }}

      - name: Show the generated Swift interface
        run: |
          # The generated facade is not committed, so this is the only place its shape is
          # visible. Worth having in the log when a Swift call site disagrees with Rust.
          echo "--- files ---"
          ls -la native/ios/build/Generated
          echo "--- public API surface ---"
          grep -hE "^\s*(public func|public class|public struct|public enum|open func)" \
            native/ios/build/Generated/*.swift | sed 's/^\s*/  /' | sort -u || true

      - name: Package the unsigned .ipa
        env:
          # THE RUN NUMBER BECOMES CFBundleVersion, and without it an install silently does nothing.
          # See the long note in package-ipa.sh: a hardcoded version made every build look like the
          # copy already installed, so on-device signers skipped the replacement while reporting
          # success.
          CONTINUUM_BUILD_NUMBER: ${{ github.run_number }}
        run: ./native/ios/package-ipa.sh

      # Fails the job rather than uploading nothing, so a green tick always means there is
      # an installable file at the end of it.
      - name: Verify the .ipa
        run: |
          IPA=native/ios/build/Continuum.ipa
          [ -f "$IPA" ] || { echo "::error::no .ipa was produced"; exit 1; }

          SIZE=$(stat -f%z "$IPA")
          echo "size: $SIZE bytes"
          [ "$SIZE" -gt 100000 ] || { echo "::error::.ipa is implausibly small ($SIZE bytes)"; exit 1; }

          # The things that make it installable and useful, checked individually. Each core
          # gets its own message naming the system that would not run, because "the .ipa is
          # fine" has to mean "every system in the Library can actually be launched".
          unzip -l "$IPA" | grep -q "Payload/Continuum.app/Continuum" \
            || { echo "::error::no executable at Payload/Continuum.app/Continuum"; exit 1; }
          unzip -l "$IPA" | grep -q "Payload/Continuum.app/Info.plist" \
            || { echo "::error::no Info.plist in the bundle"; exit 1; }
          unzip -l "$IPA" | grep -q "libcontinuum_switch.dylib" \
            || { echo "::error::the libretro wrapper is not embedded; the app would launch and fail to load a core"; exit 1; }
          unzip -l "$IPA" | grep -q "fceumm_libretro_ios.dylib" \
            || { echo "::error::the NES core is not embedded; .nes files would list in the Library and fail to launch"; exit 1; }
          unzip -l "$IPA" | grep -q "mesen2_libretro_ios.dylib" \
            || { echo "::error::Mesen, the default NES core, is not embedded; .nes files would fail to launch unless FCEUmm is picked in Settings"; exit 1; }
          unzip -l "$IPA" | grep -q "mgba_libretro_ios.dylib" \
            || { echo "::error::the GBA/GB/GBC core is not embedded; .gba, .gb and .gbc files would list in the Library and fail to launch"; exit 1; }
          unzip -l "$IPA" | grep -q "genesis_plus_gx_libretro_ios.dylib" \
            || { echo "::error::the Mega Drive/Master System/Game Gear core is not embedded; .md, .gen, .sms and .gg files would list in the Library and fail to launch"; exit 1; }
          unzip -l "$IPA" | grep -q "snes9x_libretro_ios.dylib" \
            || { echo "::error::the SNES core is not embedded; .sfc and .smc files would list in the Library and fail to launch"; exit 1; }
          unzip -l "$IPA" | grep -q "melonds_libretro_ios.dylib" \
            || { echo "::error::the DS core is not embedded; .nds files would list in the Library and fail to launch"; exit 1; }
          unzip -l "$IPA" | grep -q "mednafen_pce_fast_libretro_ios.dylib" \
            || { echo "::error::the TurboGrafx-16 core is not embedded; .pce files would list in the Library and fail to launch"; exit 1; }
          unzip -l "$IPA" | grep -q "stella2023_libretro_ios.dylib" \
            || { echo "::error::the Atari 2600 core is not embedded; .a26 files would list in the Library and fail to launch"; exit 1; }
          unzip -l "$IPA" | grep -q "parallel_n64_libretro_ios.dylib" \
            || { echo "::error::the N64 core is not embedded; .n64, .z64 and .v64 files would list in the Library and fail to launch"; exit 1; }
          unzip -l "$IPA" | grep -q "azahar_libretro_ios.dylib" \
            || { echo "::error::the 3DS core is not embedded; .3ds, .3dsx, .cci and .cxi files would list in the Library and fail to launch"; exit 1; }
          unzip -l "$IPA" | grep -q "ppsspp_libretro_ios.dylib" \
            || { echo "::error::the PSP core is not embedded; .cso files would list in the Library and fail to launch"; exit 1; }
          # Not a core. MoltenVK is the gate on every hardware rendered system, and because it is
          # dlopened rather than linked, its absence would not fail the build or the launch: it would
          # surface only as the Vulkan line reporting NOT AVAILABLE on a phone.
          unzip -l "$IPA" | grep -q "MoltenVK.framework/MoltenVK" \
            || { echo "::error::MoltenVK is not embedded; hardware rendered cores would be impossible and the Vulkan probe would report it missing"; exit 1; }
          unzip -l "$IPA" | grep -q "pcsx_rearmed_libretro_ios.dylib" \
            || { echo "::error::the PS1 core is not embedded; the app would launch and fail to load PCSX ReARMed"; exit 1; }
          unzip -l "$IPA" | grep -q "mednafen_psx_hw_libretro_ios.dylib" \
            || { echo "::error::Beetle PSX HW is not embedded; choosing it as the PlayStation core in Settings would fail to load it"; exit 1; }
          # OPTIONAL CORES: a WARNING, never a failure. Each may be absent from a good build (a
          # buildbot download that failed on the day, or flycast not compiling); the app then names
          # it as not in the bundle on its cores line. One line per core naming the system.
          LISTING="$(unzip -l "$IPA")"
          optional() { grep -q "$1" <<<"$LISTING" || echo "::warning::$1 is not embedded; $2 games will list in the Library and say the core is missing"; }
          optional flycast_libretro_ios.dylib "Dreamcast"
          optional continuum_symbian_libretro_ios.dylib "Symbian / N-Gage"
          for jit_build in pcsx_rearmed_jit_libretro_ios.dylib parallel_n64_jit_libretro_ios.dylib \
                           flycast_jit_libretro_ios.dylib; do
            grep -q "$jit_build" <<<"$LISTING" \
              || echo "::warning::$jit_build is not embedded; that core runs without JIT even when JIT is on"
          done
          optional mednafen_wswan_libretro_ios.dylib "WonderSwan and WonderSwan Color"
          optional mednafen_ngp_libretro_ios.dylib "Neo Geo Pocket and Pocket Color"
          optional mednafen_pce_libretro_ios.dylib "PC Engine CD"
          optional mednafen_supergrafx_libretro_ios.dylib "SuperGrafx (.sgx)"
          optional puae_libretro_ios.dylib "Commodore Amiga"
          optional vice_x64sc_libretro_ios.dylib "Commodore 64"
          optional dosbox_pure_libretro_ios.dylib "DOS"
          optional prboom_libretro_ios.dylib "DOOM (.wad)"
          optional virtualjaguar_libretro_ios.dylib "Atari Jaguar"
          optional handy_libretro_ios.dylib "Atari Lynx"
          optional prosystem_libretro_ios.dylib "Atari 7800"
          optional a5200_libretro_ios.dylib "Atari 5200"
          optional fbneo_libretro_ios.dylib "Arcade (FinalBurn Neo, the default arcade core)"
          optional mame2003_plus_libretro_ios.dylib "Arcade on MAME 2003-Plus"
          optional pokemini_libretro_ios.dylib "Pokemon Mini"
          optional mednafen_vb_libretro_ios.dylib "Virtual Boy"
          optional yabause_libretro_ios.dylib "Sega Saturn (Yabause, the default Saturn core)"
          optional mednafen_saturn_libretro_ios.dylib "Sega Saturn on Beetle Saturn"
          optional picodrive_libretro_ios.dylib "Sega 32X"
          grep -q "support/prboom.wad" <<<"$LISTING" \
            || echo "::warning::prboom.wad is not bundled; DOOM will ask for it at launch"
          # The bundled players (scripts/fetch-players.sh), optional like the buildbot cores.
          grep -q "support/players/ruffle/ruffle.js" <<<"$LISTING" \
            || echo "::warning::the Ruffle player is not bundled; Flash (.swf) games will say the player is not in this build"
          grep -q "support/players/j2me/bld/main-all.js" <<<"$LISTING" \
            || echo "::warning::the J2meJS player is not bundled; J2ME (.jar) games will say the player is not in this build"
          # Every @rpath library the app binary links must be inside the app, or iOS kills it at launch
          # (build 117 shipped linked to AMSMB2.framework without embedding it).
          rm -rf /tmp/ipacheck && mkdir /tmp/ipacheck && unzip -q "$IPA" -d /tmp/ipacheck
          APP=/tmp/ipacheck/Payload/Continuum.app
          for lib in $(otool -L "$APP/Continuum" | awk '/@rpath\//{print $1}' | sed 's#@rpath/##'); do
            [ -e "$APP/Frameworks/$lib" ] || { echo "::error::the app links $lib but it is not in Frameworks; it would close on launch"; exit 1; }
          done
          # THE APP ICON, only if there is supposed to be one.
          #
          # There is not, at the moment: the app ships no icon and installs as a blank white
          # square (see the long note in native/ios/project.yml for why). So this is gated on
          # the catalogue actually being in the source tree, which keeps the check honest in
          # both directions — it cannot fail a build for a missing icon nobody asked for, and
          # it cannot be quietly satisfied by an icon that failed to arrive.
          #
          # When there IS one, it has to land as two separate things or it does not work:
          # actool's compiled catalogue, and the CFBundleIcons keys merged into the built
          # Info.plist that tell iOS to look inside it. A missing icon is invisible in a build
          # log, because the app builds, installs and runs perfectly well without one, which
          # is exactly the failure class this file exists to catch.
          if [ -d native/ios/Assets.xcassets/AppIcon.appiconset ]; then
            [ -f "$APP/Assets.car" ] \
              || { echo "::error::native/ios/Assets.xcassets exists but no Assets.car reached the bundle; the app would install as a blank white square"; exit 1; }
            plutil -extract CFBundleIcons.CFBundlePrimaryIcon.CFBundleIconFiles json -o - "$APP/Info.plist" 2>/dev/null | grep -qi AppIcon \
              || { echo "::error::the built Info.plist names no icon files; iOS would show a blank icon even with Assets.car present. Is ASSETCATALOG_COMPILER_APPICON_NAME set in project.yml?"; exit 1; }
            LOOSE=$(ls "$APP"/AppIcon*.png 2>/dev/null | wc -l | tr -d ' ')
            [ "$LOOSE" -gt 0 ] \
              || echo "::warning::no loose AppIcon*.png in the bundle; the icon should still come from Assets.car, but check the home screen on a phone"
            echo "app icon: Assets.car present, Info.plist names it, $LOOSE loose PNGs"
          else
            echo "app icon: none in the source tree, so none expected in the bundle"
          fi
          echo "ipa verified"

      - name: Upload the .ipa
        uses: actions/upload-artifact@v7
        with:
          name: Continuum-ipa-${{ github.sha }}
          path: native/ios/build/Continuum.ipa
          if-no-files-found: error
          retention-days: 30

      # THE INSTALLABLE COPY, and the artifact above is not one.
      #
      # An Actions artifact can only be downloaded by something that can authenticate as a logged-in
      # GitHub user. It arrives as a zip containing the .ipa, and no on-device signing tool can
      # fetch one from a URL. That is why installing has meant opening the Actions page, downloading
      # a zip, unzipping it and importing by hand, every single time.
      #
      # A Release asset on a public repository is plain unauthenticated HTTPS, so ESign and Feather
      # can pull it straight down. More usefully, GitHub keeps a permanent redirect at
      # /releases/latest/download/<asset>, which always resolves to the newest release's copy. So
      # ONE bookmarked link installs whatever the latest build is, with no repository browsing at
      # all. The asset name has to stay exactly `Continuum.ipa` for that URL to keep working.
      #
      # A tag per run rather than one reused tag, because build history has already been worth
      # having: when the app would not open, the question "does an older build still open" was the
      # one that would have separated a code fault from a signing fault, and that needs older
      # builds to still be reachable.
      #
      # Not marked prerelease. `releases/latest` SKIPS prereleases, which would quietly break the
      # bookmarked link.
      - name: Publish the .ipa as a Release
        if: success() && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="build-${{ github.run_number }}-$(echo '${{ github.sha }}' | cut -c1-7)"
          LATEST="https://github.com/${{ github.repository }}/releases/latest/download/Continuum.ipa"
          # Notes via a FILE rather than an inline --notes string. The text wants blank lines and
          # backticks, and both are hazards inside a shell argument in a YAML block scalar; a heredoc
          # quoted with <<'EOF' passes them through untouched with no escaping to get wrong.
          cat > /tmp/notes.md <<'EOF'
          **Continuum beta**, an all-in-one emulator for iPhone. No games or BIOS files included,
          you'll need your own.

          Grab `Continuum-<number>.ipa` below (both .ipa files are the same app, the numbered one
          just tells you which build it is) and sign it with whatever sideloading app you use.

          Something broken? Settings, Send feedback, or in a game tap ⋯ then Send feedback about
          this game. The `get-task-allow` files are only for signing apps that ask for an
          entitlements file.

          Always the newest build:
          EOF
          echo "$LATEST" >> /tmp/notes.md
          printf '\nBuilt from %s on %s.\n' "${{ github.sha }}" "${{ github.ref_name }}" >> /tmp/notes.md
          # No --latest flag: a non-prerelease, non-draft release is already what
          # /releases/latest resolves to, and the flag is recent enough that relying on it would
          # risk failing this step at the very end of a long build for no gain.
          # The entitlements files ride along so they have a stable download URL too. ESign asks for
          # a FILE rather than pasted text, and a phone with no computer has no way to write a
          # plist, so these have to be downloadable.
          # TWO COPIES OF THE SAME .ipa, UNDER TWO NAMES, AND THE SECOND ONE EXISTS BECAUSE THE
          # FIRST ONE'S NAME IS A TRAP.
          #
          # Continuum.ipa is the fixed name that /releases/latest/download/Continuum.ipa depends
          # on, so it has to stay. But every build downloading under one name means a phone
          # accumulates Continuum.ipa, Continuum-1.ipa, Continuum-2.ipa with nothing to say which
          # build each one is, and an on-device signer lists them looking nearly identical. Signing
          # last week's file by accident is then the expected outcome, not a slip, and it presents
          # as a brand new core being absent from a build that definitely contains it.
          #
          # Continuum-<run>.ipa carries the build number in the FILENAME, so the right file is
          # identifiable in Files and in the signer's own list without checking a size or a hash.
          cp native/ios/build/Continuum.ipa "native/ios/build/Continuum-${{ github.run_number }}.ipa"

          # RETRIED, because build 135 died right here. The .ipa was built, verified and
          # uploaded; then GitHub's own API answered HTTP 500 to the release creation and the
          # whole 40 minute job went red with a perfectly good app in it that the owner had no
          # way to download — an Actions artifact needs a logged-in GitHub account, and the point
          # of this step is the unauthenticated link. A transient 5xx from someone else's server
          # must not cost a build.
          #
          # Five attempts with growing gaps. `gh release create` is not atomic: it can create the
          # release and then fail while uploading an asset, so a retry can meet a release that
          # already exists. That is treated as success and the assets are re-uploaded with
          # --clobber, which is idempotent.
          #
          # --target is the commit this job BUILT. Without it the new tag is made from master as it
          # is when the release is created, and anything pushed during the 40 minute build would
          # put this build's tag on a commit it does not contain.
          publish() {
            gh release create "$TAG" \
              native/ios/build/Continuum.ipa \
              "native/ios/build/Continuum-${{ github.run_number }}.ipa" \
              native/ios/get-task-allow.entitlements \
              native/ios/get-task-allow.plist \
              --target "${{ github.sha }}" \
              --title "Continuum build ${{ github.run_number }}" \
              --notes-file /tmp/notes.md
          }
          upload_into_existing() {
            gh release upload "$TAG" \
              native/ios/build/Continuum.ipa \
              "native/ios/build/Continuum-${{ github.run_number }}.ipa" \
              native/ios/get-task-allow.entitlements \
              native/ios/get-task-allow.plist \
              --clobber
          }
          # AN ADOPTED RELEASE MAY BE A DRAFT. With files attached, `gh release create` makes the
          # release as a draft, uploads, and only then publishes it, so an attempt that died
          # part-way can leave a draft behind, and `gh release view` finds drafts too. Uploading
          # into it is not enough: /releases/latest skips drafts, so the newest-build link would go
          # on serving the previous build while this step reported success. So it is published
          # here, which changes nothing if it already was. --target again because a draft only
          # gets its tag when it is published.
          publish_existing() {
            gh release edit "$TAG" --draft=false --target "${{ github.sha }}"
          }

          published=0
          for attempt in 1 2 3 4 5; do
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "attempt $attempt: $TAG already exists, making sure its files are the ones just built and it is published"
              if upload_into_existing && publish_existing; then published=1; break; fi
            elif publish; then
              published=1; break
            fi
            if [ "$attempt" -lt 5 ]; then
              sleep=$((attempt * 15))
              echo "attempt $attempt failed; retrying in ${sleep}s"
              sleep "$sleep"
            fi
          done

          if [ "$published" -ne 1 ]; then
            echo "::error::could not publish $TAG after 5 attempts. The .ipa itself is fine and is attached to this run as an artifact; this is GitHub's release API refusing."
            exit 1
          fi

          echo "released $TAG with Continuum.ipa"
          echo "always-newest link: $LATEST"

      # Written to the run's SUMMARY rather than only to the log, because the summary renders as a
      # page with tappable links on a phone while a log line is text to be copied by hand.
      - name: Say how to install it
        if: success() && github.ref == 'refs/heads/master'
        run: |
          set -euo pipefail
          REPO="https://github.com/${{ github.repository }}"
          LATEST="$REPO/releases/latest/download/Continuum.ipa"
          {
            echo "## Install this build"
            echo
            echo "**[Download Continuum.ipa]($LATEST)** — this link always gives the newest build, so it is the one to bookmark."
            echo
            echo "Then import it into ESign or Feather and sign it with your certificate."
            echo
            echo "### Deep links, if your signer supports them"
            echo
            echo "These open the signing app directly. NOT VERIFIED on a device yet, so if one of them"
            echo "does nothing, use the download link above and import by hand, and say which failed."
            echo
            echo "- ESign: \`esign://install?url=$LATEST\`"
            echo "- Feather: \`feather://install?url=$LATEST\`"
            echo
            echo "Built from \`${{ github.sha }}\`."
          } >> "$GITHUB_STEP_SUMMARY"

      # Uploaded separately because when something *does* go wrong on device, this is what
      # says why: the entitlements that were embedded and the generated Swift that was
      # compiled. Both are build outputs that exist nowhere else.
      - name: Upload build metadata
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-build-metadata-${{ github.sha }}
          path: |
            native/ios/build/Generated/
            native/ios/project.yml
            native/ios/build/lib/core-sources.txt
          if-no-files-found: warn
          retention-days: 14
