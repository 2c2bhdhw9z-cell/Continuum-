name: cBoy Pass A

# The mGBA suite work lives on this branch only. `master` is deliberately not a trigger: while
# Pass A is being iterated, neither the shipped code nor an iOS build (ios.yml pushes on
# master only) should move.
#
# The suite needs no devkitARM. scripts/mgba-suite-build/build.sh builds suite.gba with a stock
# arm-none-eabi-gcc, carrying its own replacements for libgba, grit and gbafix, so a plain Linux
# runner can do the whole loop — which the phone this project is developed from cannot.
on:
  push:
    branches: ["cboy-pass-a"]
  workflow_dispatch:

# A second push while a run is going cancels the first: the newer commit is the one that matters.
concurrency:
  group: cboy-pass-a
  cancel-in-progress: true

jobs:
  suite:
    name: mGBA suite, then the whole cBoy test suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cores/continuum-gb
    steps:
      - uses: actions/checkout@v4

      - name: Cross toolchain for the suite ROM
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi \
            unzip python3
          arm-none-eabi-gcc --version
          python3 --version

      # rustup is preinstalled on the runner and the pin in the repo's rust-toolchain.toml
      # (1.92.0) is what cargo uses, so the suite runs on the compiler the app is built with.
      - name: Rust (the pin in rust-toolchain.toml)
        run: cargo --version

      - name: Test ROMs
        run: ./scripts/fetch-test-roms.sh

      - name: Build the mGBA suite
        run: ./scripts/mgba-suite-build/build.sh

      # The runner follows these from the map instead of written-down addresses, so print them:
      # a 0/0 line means the map and the ROM disagree, and this says which addresses were used.
      - name: Where the suite put its counters
        run: grep -E ' (suites|nSuites|timedOut)$' scripts/mgba-suite-build/build/suite.map || true

      - name: cargo test --release
        run: |
          set -o pipefail
          status=0
          cargo test --release 2>&1 | tee cargo-test.log || status=$?
          # A fresh checkout skips whole suites (their ROMs are not fetched), so the test that
          # stops the run is often not the last thing printed. Repeating every binary's result
          # line and the names under `failures:` at the end puts them beyond truncation.
          echo '--- results ---'
          grep -E '^test result:|^failures:$|^    [a-z_0-9]+$|^error' cargo-test.log || true
          exit $status

      - name: mGBA suite scores and FAIL lines
        run: |
          set -o pipefail
          cargo run --release --example p7mgba 2>&1 | tee p7mgba.log
          # The run prints a score line per suite and then its FAIL lines, which is longer than a
          # log tail keeps. Printing the score lines again at the end puts all of them where they
          # survive truncation, so no suite's score is ever lost.
          echo '--- scores ---'
          grep '^SUITE' p7mgba.log || true
          echo '--- fail lines ---'
          grep -E '^  FAIL|^STOPPED' p7mgba.log || true

      - name: Video, framebuffer-diffed
        run: |
          set -o pipefail
          cargo run --release --example p8video 2>&1 | tee p8video.log
          echo '--- video ---'
          grep -E '^\[|^VIDEO' p8video.log || true


      # The two Video pictures that do not match yet, with p8video's own probe: the colours it
      # finds and a 0/1 string of which lines the background is on, for ACTUAL and EXPECTED.
      # Those are the two things a fix has to reproduce, and they are printed here so they land
      # in a log tail instead of being guessed at.
      - name: Video probe for the failing pictures
        if: always()
        run: |
          : > probe.log
          for i in 2 4; do
            echo "=== probe test $i ===" >> probe.log
            P8VIDEO_PROBE=$i cargo run --release --example p8video >> probe.log 2>&1 || true
          done
          grep -E '^(=== probe test|    (ACTUAL|EXPECTED) (distinct|bg-on))' probe.log || true

      # The two suites Pass A works on next, by the shape of their failures: the register or test
      # name out of each FAIL line, most common first. 118 and 171 failures are too many to read
      # one by one, but a histogram of them says at once whether a whole family of registers is
      # wrong (one name with a big count) or the damage is spread.
      - name: FAIL lines by register (I/O read, Memory)
        if: always()
        run: |
          for suite in 'I/O read' 'Memory'; do
            echo "--- $suite: FAIL lines by name ---"
            awk -v s="SUITE $suite" 'index($0, s) == 1 { f = 1; next } /^SUITE /{ f = 0 } f' p7mgba.log 2>/dev/null \
              | sed 's/^  FAIL //; s/:.*//' | sort | uniq -c | sort -rn | head -30 || true
            echo "--- $suite: first 12 FAIL lines ---"
            awk -v s="SUITE $suite" 'index($0, s) == 1 { f = 1; next } /^SUITE /{ f = 0 } f' p7mgba.log 2>/dev/null \
              | head -12 || true
          done

      # Last, so this is what a log tail keeps: every number these runs exist to produce, in one
      # place, whether the steps above passed or not.
      - name: Scorecard
        if: always()
        run: |
          echo '========== SCORECARD =========='
          echo '--- cargo test --release ---'
          grep -E '^test result:' cargo-test.log 2>/dev/null || echo '(did not run)'
          echo '--- mGBA suite ---'
          grep '^SUITE' p7mgba.log 2>/dev/null || echo '(did not run)'
          echo '--- Video ---'
          grep -E '^\[|^VIDEO' p8video.log 2>/dev/null || echo '(did not run)'
          echo '--- probe ---'
          grep -E '^(=== probe test|    (ACTUAL|EXPECTED) (distinct|bg-on))' probe.log 2>/dev/null || true
          echo '========== END =========='
