<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>Continuum — All-in-One Console Library</title>
<meta name="description" content="A WebGPU emulator front end for retro and modern consoles." />

<!-- PWA. Phase 2 reuses these values for the iOS bundle's launch appearance. -->
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="./icons/icon.svg" />
<meta name="theme-color" content="#08080c" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Continuum" />

<link rel="stylesheet" href="./styles/tokens.css" />
<link rel="stylesheet" href="./styles/base.css" />
<link rel="stylesheet" href="./styles/shell.css" />
<link rel="stylesheet" href="./styles/library.css" />
<link rel="stylesheet" href="./styles/player.css" />
</head>
<body>
<!--
  Two top-level views, never both visible. The player is not a route that
  re-renders the library: the library keeps its scroll position and its node pool
  while a game runs, so returning from a game is instant.
-->
<div id="app" class="app" data-view="library">

  <!-- ───────────────────────────── Library ───────────────────────────── -->
  <div class="view view--library" id="view-library">

    <header class="topbar" id="topbar">
      <div class="topbar__brand">
        <span class="brand__mark" aria-hidden="true"></span>
        <span class="brand__name">CONTINUUM</span>
      </div>

      <nav class="topbar__nav" aria-label="Library sections">
        <button class="navlink is-active" data-mode="shelves" type="button">Home</button>
        <button class="navlink" data-mode="grid" type="button">All Games</button>
        <button class="navlink" data-mode="favorites" type="button">Favorites</button>
      </nav>

      <div class="topbar__actions">
        <div class="search">
          <svg class="search__icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M10 4a6 6 0 104 10.5l4.3 4.3 1.4-1.4-4.3-4.3A6 6 0 0010 4zm0 2a4 4 0 110 8 4 4 0 010-8z"/>
          </svg>
          <input id="search-input" class="search__input" type="search" placeholder="Search 4,800 titles…"
                 autocomplete="off" spellcheck="false" aria-label="Search titles" />
        </div>
        <button class="btn btn--ghost btn--compact" data-action="import-rom" type="button"
                title="Add a ROM from this device">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg>
          Add ROM
        </button>
        <!-- Kept out of the layout; opened by the button and by drag-and-drop. -->
        <input type="file" id="rom-file-input" multiple hidden />
        <button class="pill" id="gpu-pill" type="button" title="Graphics backend status">
          <span class="pill__dot" data-state="unknown"></span>
          <span class="pill__label" id="gpu-pill-label">WebGPU</span>
        </button>
      </div>
    </header>

    <!--
      The single scroll container for the library. Everything inside is either
      fixed-height chrome or virtualised: no element count here grows with the
      size of the catalogue.
    -->
    <main class="library" id="library-scroll" tabindex="-1">

      <section class="hero" id="hero" aria-label="Featured">
        <div class="hero__art" id="hero-art" aria-hidden="true"></div>
        <div class="hero__scrim"></div>
        <div class="hero__body">
          <p class="hero__eyebrow" id="hero-eyebrow">Featured</p>
          <h1 class="hero__title" id="hero-title">—</h1>
          <p class="hero__meta" id="hero-meta"></p>
          <p class="hero__blurb" id="hero-blurb"></p>
          <div class="hero__actions">
            <button class="btn btn--primary" id="hero-play" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
              Play
            </button>
            <button class="btn btn--ghost" id="hero-details" type="button">More info</button>
          </div>
        </div>
      </section>

      <!-- Vertical virtualiser mounts shelf rows here; each shelf virtualises
           horizontally in turn. -->
      <div class="shelves" id="shelves-viewport" role="region" aria-label="Browse by category"></div>

      <!-- Grid mode target. Same virtualiser primitive, row-of-columns renderer. -->
      <div class="grid-wrap" id="grid-viewport" role="region" aria-label="All games" hidden></div>

      <div class="empty" id="library-empty" hidden>
        <p class="empty__title">No titles match that search.</p>
        <p class="empty__hint">Try a system name, a year, or part of a title.</p>
      </div>
    </main>

    <footer class="statusbar" id="statusbar">
      <span id="status-catalog">—</span>
      <span class="statusbar__sep">·</span>
      <span id="status-dom">DOM nodes: —</span>
      <span class="statusbar__sep">·</span>
      <span id="status-cores">Cores resident: 0</span>
    </footer>
  </div>

  <!-- ───────────────────────────── Player ───────────────────────────── -->
  <div class="view view--player" id="view-player" hidden>
    <!--
      The ONLY drawing surface for emulator output. wgpu owns this element's
      backing store and its width/height attributes; nothing else may touch it,
      and there is no 2D context anywhere in this project.
    -->
    <canvas id="gpu-canvas" class="gpu-canvas"></canvas>

    <div class="player__chrome" id="player-chrome">
      <div class="player__top">
        <button class="iconbtn" id="player-back" type="button" aria-label="Back to library">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.4 7.4L14 6l-6 6 6 6 1.4-1.4L10.8 12z"/></svg>
        </button>
        <div class="player__titles">
          <p class="player__title" id="player-title">—</p>
          <p class="player__subtitle" id="player-subtitle"></p>
        </div>
        <div class="player__hud" id="player-hud">
          <span class="hud__stat"><b id="hud-fps">—</b> fps</span>
          <span class="hud__stat"><b id="hud-frames">0</b> frames</span>
          <span class="hud__stat"><b id="hud-audio">0</b> ms audio</span>
          <span class="hud__stat" id="hud-pads" title="Connected controllers">⌨</span>
        </div>
      </div>

      <div class="player__bottom">
        <div class="controls">
          <button class="iconbtn" id="ctl-pause" type="button" aria-label="Pause">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
          </button>
          <button class="iconbtn" id="ctl-reset" type="button" aria-label="Reset">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V2L7 7l5 5V9a4 4 0 11-4 4H6a6 6 0 106-8z"/></svg>
          </button>
          <button class="iconbtn" id="ctl-mute" type="button" aria-label="Mute">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h3l5 4V5L7 9H4zm12.5 3a4.5 4.5 0 00-2.5-4v8a4.5 4.5 0 002.5-4z"/></svg>
          </button>
          <button class="textbtn" id="ctl-save" type="button">Save state</button>
          <label class="select">
            Scale
            <select id="ctl-scale">
              <option value="aspect">Aspect fit</option>
              <option value="integer">Integer</option>
              <option value="stretch">Stretch</option>
            </select>
          </label>
          <label class="select">
            Filter
            <select id="ctl-filter">
              <option value="nearest">Nearest</option>
              <option value="linear">Linear</option>
            </select>
          </label>
          <label class="select">
            Speed
            <select id="ctl-speed">
              <option value="0.5">0.5x</option>
              <option value="1" selected>1x</option>
              <option value="2">2x</option>
              <option value="4">4x</option>
            </select>
          </label>
        </div>
      </div>
    </div>

    <!-- Shown when AudioContext is still suspended: iOS Safari requires a
         gesture, and silently muted audio is a support nightmare. -->
    <button class="audio-unlock" id="audio-unlock" type="button" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h3l5 4V5L7 9H4z"/></svg>
      Tap to enable sound
    </button>

    <!-- On-screen pad for touch devices. Feeds the same bridge input API as the
         keyboard, so the core cannot tell them apart. -->
    <div class="touchpad" id="touchpad" hidden aria-hidden="true">
      <div class="touchpad__dpad">
        <button class="tp tp--up"    data-button="4"></button>
        <button class="tp tp--down"  data-button="5"></button>
        <button class="tp tp--left"  data-button="6"></button>
        <button class="tp tp--right" data-button="7"></button>
      </div>
      <div class="touchpad__face">
        <button class="tp tp--b" data-button="0">B</button>
        <button class="tp tp--a" data-button="8">A</button>
      </div>
      <div class="touchpad__center">
        <button class="tp tp--select" data-button="2">SELECT</button>
        <button class="tp tp--start"  data-button="3">START</button>
      </div>
      <div class="touchpad__shoulders">
        <button class="tp tp--l" data-button="10">L</button>
        <button class="tp tp--r" data-button="11">R</button>
      </div>
    </div>

    <div class="loading" id="player-loading" hidden>
      <div class="loading__box">
        <p class="loading__title" id="loading-title">Loading core…</p>
        <div class="progress"><div class="progress__bar" id="loading-bar"></div></div>
        <p class="loading__detail" id="loading-detail">Fetching module</p>
      </div>
    </div>
  </div>

  <!-- ─────────────────────────── Detail sheet ─────────────────────────── -->
  <div class="sheet" id="detail-sheet" hidden>
    <div class="sheet__backdrop" data-close></div>
    <div class="sheet__panel" role="dialog" aria-modal="true" aria-labelledby="detail-title">
      <button class="sheet__close" data-close type="button" aria-label="Close">
        <!-- SVG, not "✕": the glyph is missing from some font stacks and renders
             as tofu, which looks like a broken build. -->
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.3 5.7L12 12l6.3 6.3-1.4 1.4L10.6 13.4 4.3 19.7 2.9 18.3 9.2 12 2.9 5.7 4.3 4.3l6.3 6.3 6.3-6.3z"/></svg>
      </button>
      <div class="detail">
        <div class="detail__art" id="detail-art" aria-hidden="true">
          <span class="detail__badge" id="detail-badge"></span>
          <span class="detail__glyph" id="detail-glyph"></span>
        </div>
        <div class="detail__body">
          <h2 class="detail__title" id="detail-title">—</h2>
          <p class="detail__meta" id="detail-meta"></p>
          <p class="detail__provenance" id="detail-provenance" hidden></p>
          <p class="detail__blurb" id="detail-blurb"></p>
          <div class="detail__actions">
            <button class="btn btn--primary" id="detail-play" type="button">Play</button>
            <button class="btn btn--ghost" id="detail-favorite" type="button">Add to favorites</button>
            <button class="btn btn--ghost" id="detail-remove" type="button" hidden>Remove ROM</button>
          </div>
          <div class="detail__states">
            <div class="detail__states-head">
              <h3>Save states</h3>
              <span id="detail-states-count"></span>
            </div>
            <!-- Virtualised too: a long-lived library accumulates hundreds of
                 states per game, and this list must not grow the DOM either. -->
            <div class="states" id="detail-states" role="list"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="drop-hint" id="drop-hint" hidden>
    <div class="drop-hint__panel">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l5 5h-3v6h-4V8H7zM5 18h14v2H5z"/></svg>
      <p class="drop-hint__title">Drop ROMs to add them</p>
      <p class="drop-hint__body">NES, SNES, Game Boy, GBA, Mega Drive, Master System, N64</p>
    </div>
  </div>

  <div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>
</div>

<noscript>
  <p style="padding:2rem;color:#eee;background:#111">
    This front end is a WebGPU application and requires JavaScript.
  </p>
</noscript>

<script type="module" src="./src/main.js"></script>
</body>
</html>
