# The Rust toolchain is pinned, and the pin is load-bearing.
#
# The iOS workflow (.github/workflows/ios.yml) installs this same pin in both jobs: the Linux
# `checks` job runs the test suite with it and the macOS `ipa` job builds the engine in the
# .ipa with it. With a floating `stable`, the compiler that builds the app would move on
# someone else's schedule:
#
#   - The engine on the phone would be built by a compiler the tests never ran on.
#   - A new clippy release adds lints to code nobody touched. That happened:
#     `unnecessary_sort_by` started firing on a pre-existing `sort_by` in cores/registry.rs.
#
# Pinning makes `cargo test` on a dev machine run on the compiler CI uses, and `cargo clippy`
# report the same lints on every machine, which is the only way the checks are verifiable
# before pushing. Raising the version is a deliberate one-line change here, done together with
# re-running what the workflow's `checks` job runs (the older, longer checklist is §6 of
# docs/archive/SESSION_HANDOFF.md) — not something that happens on a Thursday because upstream
# shipped.
[toolchain]
channel    = "1.92.0"
profile    = "minimal"
components = ["clippy", "rustfmt"]
targets    = ["aarch64-apple-ios"]
