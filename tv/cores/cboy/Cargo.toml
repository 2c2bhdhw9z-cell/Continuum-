# cBoy for the TV: the TV's own copy of cBoy (cores/continuum-gb), kept separate on purpose
# (owner, 22 November 2026: "The tv core is separate. It's for a tv. Not a fucking iPhone or
# android"). TV speed work goes here only; the phone's cBoy is never changed for the TV.
# Nothing in .github/workflows/ios.yml watches tv/, so a push here starts no iPhone build.
[package]
name = "cboy-tv"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[lib]
name = "cboy_tv"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
libc = "0.2"

[features]
# Prints the exact drawer's state on every picture-register write (scripts/sameboy). Test only.
trace = []
# Prints every Advance bus access with its cycles (the timing test programs). Test only.
gba_trace = []

[dev-dependencies]
png = "0.17"

[profile.test]
opt-level = 2

[workspace]
