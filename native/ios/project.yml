                - "wad"
          - UTTypeIdentifier: dev.continuum.disc-image
            UTTypeDescription: Game disc image
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - "cue"
                - "chd"
                - "pbp"
                - "mdf"
                - "mds"
                - "toc"
                - "ccd"
                - "gdi"
                - "cdi"
                - "m3u"
          - UTTypeIdentifier: dev.continuum.skin
            UTTypeDescription: Controller skin
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - "deltaskin"
                - "manicskin"
          - UTTypeIdentifier: dev.continuum.cheat
            UTTypeDescription: Cheat list
            UTTypeConformsTo:
