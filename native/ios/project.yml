        # AirPlay / cable TV output. Only the external display role is declared: the app's own
        # scene stays SwiftUI's WindowGroup. Without this entry iOS mirrors the phone instead of
        # giving the app a scene for the TV. The class name is fixed with @objc in
        # ScreenModes.swift, so no module prefix is needed.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleExternalDisplayNonInteractive:
              - UISceneConfigurationName: External Display
                UISceneDelegateClassName: ExternalDisplaySceneDelegate
    # EVERY SWIFT FILE THE APP NEEDS MUST BE LISTED HERE, BY NAME. This list is explicit, not a
    # directory glob, so a new file that is not added below is simply never compiled: the app
    # builds, installs and launches, and the feature in that file does not exist, with no error
    # anywhere to read. Adding a file to native/ios/ and forgetting this line is therefore a silent
    # failure, which is the worst kind on a build whose only debugger is the on-screen HUD.
    sources:
      - path: ContinuumApp.swift
      - path: MetalCanvas.swift
      # The switch that hides Apple's Metal Performance HUD (Settings > Diagnostics).
      # WITHOUT THIS LINE the build breaks in MetalCanvas, ScreenModes and SettingsScreen.
      - path: AppleOverlay.swift
      # Sound. The AVAudioSession and AVAudioEngine graph, and the lock-free single-producer
      # single-consumer ring between the display link that drains the engine and the render block
      # that plays it. IF THIS LINE GOES MISSING THE APP IS SILENT AND NOTHING SAYS WHY, which is
      # exactly the failure the comment above this list is about.
      - path: AudioOutput.swift
      # The on-screen pad: the engine's button wire format, the per-system control sets, and the
      # multi-touch surface that tracks the D-pad as one region so diagonals resolve. It also holds
      # TouchLayout, the six persisted numbers the editor below writes.
      - path: TouchControls.swift
      # Physical controllers: MFi, Xbox, DualShock and DualSense through GameController. The
      # connect and disconnect observers, the per frame poll the display link reads, and the
      # translation into the engine's W3C button order. It writes the engine's GAMEPAD input layer
      # while TouchControls.swift writes the TOUCH layer, which is what lets both be used at once.
      # WITHOUT THIS LINE nothing in it is compiled, and for once that fails loudly rather than
      # silently: ContinuumApp, MetalCanvas, PlayerScreen and SettingsScreen all name types from it,
      # so the build breaks in four other files instead of shipping an app that quietly ignores
      # every controller. That is luck rather than a safety net, and it is not a reason to leave the
      # line out. The GameController framework itself needs no entry here, because Swift autolinks
      # what it imports; AVFoundation in AudioOutput.swift is listed nowhere either.
      - path: PhysicalControllers.swift
      # Keyboards (GCKeyboard, UIPress, the on-screen keyboard), CoreMotion for tilt games, the
      # Controllers screen (ports, controller type, button mapping profiles, motion settings) and
      # the EngineHost methods shake, toggleAnalogMode, toggleDSLid, blowIntoMic, pressHomeButton,
      # showControllers, cycleTriggerProfile and showButtonBinding. WITHOUT THIS LINE the build
      # breaks in PlayerScreen and SettingsScreen, which name types from it.
      - path: InputExtras.swift
      # The layout editor: the full-screen screen that moves the on-screen controls. It mounts the
      # REAL pad in edit mode rather than a drawing of one, so what is dragged is what a game gets.
      # Without this line the button in Settings has nothing to open and the layout is fixed again,
      # with nothing anywhere to say why.
      - path: TouchLayoutEditor.swift
      # Delta .deltaskin import: info.json parse, ZIP extract, map item frames onto TouchLayout,
      # and the UIDocumentPicker entry the layout editor calls. WITHOUT THIS LINE the Import
      # .deltaskin button compiles against missing types and the build breaks in TouchLayoutEditor.
      - path: DeltaSkinImport.swift
      - path: SkinScreens.swift
      # DS / 3DS layout and swap choices, the TV (external display scene and the hub that
      # retargets the engine to it), trackpad mode, and their Settings section. WITHOUT THIS LINE
      # the build breaks in ContinuumApp.swift, which names ScreenModes, and the Info.plist scene
      # entry would name a delegate class that does not exist.
      - path: ScreenModes.swift
      # Edits to an imported skin, kept as an overlay on top of the file (never written into it),
      # and the full-screen editor that drags hit areas and screen holes. EngineHost lays the
      # overlay over the file in skinPadFace, which is how the player uses the edited values.
      - path: SkinEdits.swift
      - path: SkinEditor.swift
      # The skin library (many skins per system, default per system, skin per game, sharing
      # across related systems, Manic and Delta identifiers), Manic's item extras (functions,
      # switches, sound.caf), the ONE function dispatcher that skin buttons and extra buttons
      # share (it also defines PadAppAction, so FloatingButtons.swift needs it), the button
      # sound, and the library / game card / player sheets. WITHOUT THESE LINES TouchControls.swift,
      # SkinScreens.swift and FloatingButtons.swift fail to compile.
      - path: SkinLibrary.swift
      - path: ManicSkinItems.swift
      - path: SkinFunctions.swift
      - path: SkinButtonSound.swift
      - path: SkinLibraryScreen.swift
      # Extra buttons the player places anywhere: combos, turbo and app actions, per system and
      # per orientation. The pad draws and hit-tests them through FloatingButtonLayer; the editor
      # panel adds, retypes, resizes and deletes them. WITHOUT THESE LINES TouchControls.swift
      # fails to compile, which is loud, but the panel file alone would be silent.
      - path: FloatingButtons.swift
      - path: FloatingButtonsPanel.swift
      # The tap on an on-screen press, a core's rumble played on the phone and on controllers,
      # and the three settings for them (button haptics, Rumble, turbo speed).
      - path: Haptics.swift
      # The player screen's chrome, and the diagnostics panel both screens share.
      - path: PlayerScreen.swift
      # Stage 2, the library shell. The tab shell, the top bar, the hero and the shelves.
      - path: LibraryShell.swift
      # The pieces the shell is built from: hero, cards, list rows, palette, status tint.
      - path: LibraryCards.swift
      # Settings: the artwork controls and their disclosure, the layout controls, the permanent home
      # of the diagnostics, the BIOS row and the core options.
      - path: SettingsScreen.swift
      # Home screen icon switcher. Without this line the Settings section is never compiled.
      - path: AppIcons.swift
      # The five emulation preferences (fit, filter, fast-forward multiplier, volume, rewind
      # budget), their storage keys, and the re-assertion into an engine whose frame pacer is
      # rebuilt by every launch. Without this file the picture, sound and speed controls in
      # Settings do not exist and the player has no rewind or fast-forward button.
      - path: EmulationSettings.swift
      # One game's detail sheet: the facts, the artwork actions and delete.
      - path: GameDetailSheet.swift
      # Cover art, the pure half: the libretro playlist directory names, the filename to
      # thumbnail-name transform, the candidate ladder and the procedural plate.
      - path: GameArtwork.swift
      # Cover art, the working half: URLSession fetching capped at three at a time, the on-disk
      # store outside Documents, the one-week negative cache and the user-picked image.
      - path: ArtworkStore.swift
      # Cover art, the last rung: the server's own directory listings, one per system AND folder,
      # parsed once each and kept for thirty days, so a game named under a convention this app
      # cannot derive still gets its cover. The match is an equality of normalised titles, and after
      # that a whole-word prefix or suffix alignment with hard guards, which is what finds a cover
      # filed without the game's series name. Never a substring and never a distance, and an
      # alignment that hits two titles picks nothing at all.
      - path: ArtworkIndex.swift
      # Cover art, the choice: every cover the server has for one game, enumerated only when that
      # game's detail card is opened, offered as labelled thumbnails, and remembered against the
      # entry so a chosen cover outranks anything automatic resolution would pick. Nothing in here
      # runs while the library is being browsed. It also holds ArtworkChoice, the record that makes a
      # chosen, picked or CAPTURED cover survive a relaunch and a re-scan.
      - path: ArtworkChooser.swift
      # Cover art, the tier that asks nobody: one frame captured from the running game, turned into
      # the PNG the store keeps. The stride, the byte order and the meaning of the alpha byte all live
      # in here, and every one of them fails by producing a WRONG PICTURE rather than an error, which
      # is why the arithmetic is split off from the CoreGraphics call and checked on the build host.
      # WITHOUT THIS LINE the build breaks in ArtworkStore.swift, which names CapturedCover, so this
      # is one of the few files whose absence is loud. That is luck rather than a safety net: the
      # feature it carries is the last artwork tier, and it is the only one that works for a ROM no
      # cover database has ever heard of.
      - path: FrameCapture.swift
      # What a filename can honestly be made to say: the display title and the region.
      - path: GameMetadata.swift
      # Save states: the metadata index, the payload files in Application Support, the auto-save
      # written when a game is left or the app is put away, the resume on launch, and the four-check
      # gate that refuses to hand a core a state another build wrote. WITHOUT THIS LINE the app
      # still builds and every reference to it fails in four other files, which is luck rather than
      # a safety net: ContinuumApp, PlayerScreen, GameDetailSheet and SettingsScreen all name types
      # from it. The gate is the part that must never be quietly dropped, because the failure it
      # prevents is a core accepting a foreign state and corrupting itself minutes later.
      - path: SaveStates.swift
      # Cheats: the durable per-game code lists, and the one path that pushes a list into the
      # resident core as a whole and in order. Separate from SaveStates.swift because a cheat is
      # text the user typed and a state is an opaque blob a core wrote, and only one of those two
      # can corrupt a session.
      - path: CheatStore.swift
      # The 50-slot save manager, plus the share sheet and document picker that export and import
      # state files, battery saves (.srm) and .cht cheat files.
      - path: SaveSlotsScreen.swift
      # RAM search and the in-game cheat sheet. The search itself is in the Rust engine.
      - path: CheatSearch.swift
      # The feedback form: Settings and a game's ⋯ menu. Mail or the share sheet, no server.
      # WITHOUT THIS LINE the build breaks in SettingsScreen and PlayerScreen.
      - path: Feedback.swift
      # RetroAchievements: Keychain token, the URLSession half of rcheevos, unlock banners, the
      # Settings login and the game card list. rcheevos itself is in the Rust engine.
      - path: Achievements.swift
      # The microphone, the camera and Amiibo files: the AVAudioEngine input tap, the AVAudioSession
      # category switch, the AVCaptureSession, the Amiibo folder and picker, and the Settings card.
      # The decisions are all in Rust (crates/emulator-bridge/src/peripherals); this is the iOS
      # half. WITHOUT THIS LINE the build breaks in AudioOutput, ContinuumApp, PlayerScreen and
      # SettingsScreen, which all name types from it.
      - path: Peripherals.swift
      # Cloud folder sync of saves, cheats, cover choices and settings through a bookmarked folder
      # and NSFileCoordinator. The rules are in Rust (crates/emulator-bridge/src/sync).
      - path: CloudSync.swift
      # Online play transport (NWListener, NWConnection, NWBrowser) over the Rust lockstep
      # protocol (crates/emulator-bridge/src/netplay).
      - path: Netplay.swift
      # Import: every way in (clipboard, drag and drop, Open in), archives, the system picker and
      # CoreCatalog.systemResolver over the Rust detector (crates/emulator-bridge/src/import).
      - path: ImportCenter.swift
      # The Import screen behind the library's + button.
      - path: ImportScreen.swift
      # Wi-Fi transfer: NWListener HTTP server; the page and the head parser are in Rust.
      - path: WiFiTransfer.swift
      # WebDAV (URLSession PROPFIND) and SMB (libsmb2, linked statically; see fetch-libsmb2.sh).
      - path: RemoteSources.swift
      - path: SmbClient.swift
      - path: smb_min.c
      # Save files in other emulators' formats, converted in Rust, written through the battery path.
      - path: SaveFormats.swift
      # Gameplay manuals: PDFs in Documents/Manuals, PDFKit viewer, EngineHost.showGameplayManual.
      - path: GameplayManuals.swift
      # Core settings, filters, palettes, speeds, discs, rotation and the TV's own choices: the
      # in-game actions and their screens (engine side: cores/options.rs, bridge_actions.rs).
      - path: CoreSettingsScreen.swift
      # Flash (Ruffle) and J2ME (J2meJS) in a bundled local-only web player view: pure logic,
      # then the web view, scheme handler, input poll and settings sheet.
      - path: WebPlayerCore.swift
      - path: WebPlayers.swift
      # The UniFFI-generated Swift facade. Written by build-engine.sh, never committed: a
      # stale checked-in binding that disagrees with the Rust compiles, links, and then
      # corrupts arguments at runtime, which is the worst failure mode in this stack.
      - path: build/Generated
        includes:
          - "*.swift"
      # Freely licensed support files cores need, fetched by scripts/fetch-buildbot-cores.sh into
      # build/support and copied into the system folder at first launch (CoreSupportFiles in
      # ContinuumApp.swift). Today that is prboom.wad (GPL) for DOOM. A folder reference, so it
      # lands in the bundle as support/; build-engine.sh and package-ipa.sh create it even when
      # the download failed, so this path always exists.
      - path: build/support
        type: folder
        buildPhase: resources
      # THE APP ICON: the owner's own artwork, a chrome C around a gamepad with CONTINUUM
      # under it. Source kept at docs/app-icon-source.png; the 13 sizes under
      # Assets.xcassets are generated from it by `scripts/make-app-icon.py --from`, which
      # flattens its transparency (iOS refuses an icon with an alpha channel) and trims the
      # black border around its pre-rounded tile.
      #
      # THAT TRIM MATTERS. The artwork arrived drawn as a rounded tile floating on black,
      # which is what an app icon looks like — but iOS applies its OWN squircle mask, with a
      # larger corner radius than the drawn tile's, so leaving the border would have put the
      # system's curve on the home screen with the artwork's own narrower curve visible
      # inside it and a black crescent between the two, at every corner. The border measured
      # 44/40/44/51 px and was trimmed so the tile runs edge to edge and iOS rounds it once.
      #
      # Build 134 shipped a DRAWN icon and should not have: the owner had asked to see any
      # artwork before it went into the app, it went in before they saw it, and they then
      # rejected it along with three alternatives. Build 135 took it out and the plumbing
      # with it.
      #
      # THE OWNER DOES NOT LIKE THIS ARTWORK EITHER, and said so plainly. It is here because
      # it was the last image their free ChatGPT allowance would generate and they decided it
      # would do for now. So it is a PLACEHOLDER they are stuck with, not a design anyone
      # settled on: treat a request to change it as expected rather than as a surprise. What
      # is permanent is the pipeline around it (`--from` plus these two lines), which takes
      # any square picture.
      - path: Assets.xcassets
      # 180px copies of the alternate icons, so Settings can draw them. App icon
      # sets are not available through UIImage(named:).
      - path: AppIconPreviews
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.continuum.app
        PRODUCT_NAME: Continuum
        # Without this the catalogue above is compiled and no icon is assigned, so the app
        # still installs blank. The name must match the .appiconset folder.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Without this, Xcode strips every app icon that is not the primary one,
        # and setAlternateIconName fails on device because the art is not in the IPA.
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "Halo Prism Signal Plate Bitmap Circuit Quiet Cartridge Nebula Glacier Cabinet Dream Forge Orbit Rain Trace Dotmatrix Wire Wash Lens Reactor Knockout Terminal Gem Storm Clay Saturn Mark Sunset Fold Glow Velvet Badge Line Fracture Chrome Cloud Violet Slate Grid Leather Ivory Ember Spectrum Navy Emboss Mint Tube Deck Copper Graphite Lilac Cyan Sand Filament"
        # The C header + modulemap UniFFI generated next to the Swift. The modulemap is
        # renamed to module.modulemap by build-engine.sh so clang finds it by directory.
        SWIFT_INCLUDE_PATHS: "$(SRCROOT)/build/Generated"
        SWIFT_OBJC_BRIDGING_HEADER: Continuum-Bridging-Header.h
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/build/Generated $(SRCROOT)/build/smb/include"
        LIBRARY_SEARCH_PATHS: "$(inherited) $(SRCROOT)/build/lib $(SRCROOT)/build/smb/lib"
        OTHER_LDFLAGS: "$(inherited) -lemulator_bridge -lc++ -framework OpenGLES $(SRCROOT)/build/smb/lib/libsmb2.a"
    dependencies:
      # The C++ libretro wrapper, dlopened at runtime rather than linked. `embed` puts it in
      # Frameworks/; `codeSign: false` because package-ipa.sh signs everything in one pass
      # after the fact, and letting Xcode try would fail with signing disabled.
      - framework: build/lib/libcontinuum_switch.dylib
        embed: true
        # Copied into Frameworks/ but *not* linked. The engine reaches it through dlopen in
        # load_native_core, which is the whole point of a core being loadable at runtime. If
        # it were linked as well, a wrong rpath would stop the app launching at all instead
        # of surfacing "libcontinuum_switch.dylib is missing" in the HUD.
        link: false
        codeSign: false
      # The real libretro cores. Same shape as the wrapper above and for the same
      # reason: each is dlopened at runtime from Frameworks/ (a real ROM path, need_fullpath
      # for the CD cores) and never linked. `embed` puts them in Frameworks/; package-ipa.sh
      # signs everything in one pass after the fact, so `codeSign: false` keeps Xcode from
      # failing with signing disabled.
      #
      # These filenames are produced and staged by scripts/build-core.sh, which is where they
      # are defined; they must match it byte for byte, along with package-ipa.sh's embed
      # fallback, the "Verify the .ipa" greps in .github/workflows/ios.yml and CoreCatalog in
      # ContinuumApp.swift. Nothing in Xcode will tell you when one of them is wrong: the app
      # builds, installs, launches, and then cannot find a core.
      - framework: build/lib/fceumm_libretro_ios.dylib
        embed: true
        link: false
        codeSign: false
      - framework: build/lib/mgba_libretro_ios.dylib
        embed: true
        link: false
        codeSign: false
      - framework: build/lib/genesis_plus_gx_libretro_ios.dylib
        embed: true
        link: false
        codeSign: false
      - framework: build/lib/snes9x_libretro_ios.dylib
        embed: true
        link: false
        codeSign: false
      - framework: build/lib/pcsx_rearmed_libretro_ios.dylib
        embed: true
        link: false
        codeSign: false
      # Beetle PSX HW: step 4 SET_HW_RENDER Vulkan proof core. Mac/CI build only
      # (HAVE_HW=1). Soft PCSX ReARMed stays the default PlayStation route; Settings can
      # switch launches to this dylib so an IPA can exercise the HW path.
      - framework: build/lib/mednafen_psx_hw_libretro_ios.dylib
        embed: true
        link: false
        codeSign: false
      # Nintendo DS. Software renderer, so it needs nothing the other software cores do not: see
      # the note in scripts/build-core.sh ios_core_config for why this core arrives before the N64.
      - framework: build/lib/melonds_libretro_ios.dylib
        embed: true
        link: false
        codeSign: false
      # TurboGrafx-16 and Atari 2600. Both software renderers, and both reached by reading what
      # each core declares rather than by adding anything to the graphics path.
      - framework: build/lib/mednafen_pce_fast_libretro_ios.dylib
        embed: true
        link: false
        codeSign: false
      - framework: build/lib/stella2023_libretro_ios.dylib
        embed: true
        link: false
        codeSign: false
      # Nintendo 64, software rasteriser and interpreter. Needs neither MoltenVK nor JIT; see
      # scripts/build-core.sh ios_core_config and docs/PLATFORM_LIMITS.md.
      - framework: build/lib/parallel_n64_libretro_ios.dylib
        embed: true
        link: false
        codeSign: false
      # Nintendo 3DS. Azahar's libretro dylib, Vulkan set_image, CPU interpreter (IOS
      # compiles the JIT out). OpenGL is not in this build. See scripts/build-core.sh.
      - framework: build/lib/azahar_libretro_ios.dylib
        embed: true
        link: false
        codeSign: false
      # PSP. PPSSPP libretro, Vulkan set_image, IR interpreter (compile-to-native
      # off). No JIT, no dynarec, no BIOS. See scripts/build-core.sh.
      - framework: build/lib/ppsspp_libretro_ios.dylib
        embed: true
        link: false
        codeSign: false
      # OPTIONAL CORES. Same shape as every core above. Each one may be absent from a successful
      # build (a buildbot download that failed on the day, or flycast not compiling), and
      # package-ipa.sh removes the matching four-line entry before xcodegen runs when it is, so
      # keep each entry exactly this shape. Prebuilt ones are listed once in
      # scripts/fetch-buildbot-cores.sh; flycast in scripts/build-core.sh IOS_OPTIONAL_CORES.
      #
      # Dreamcast, built from source, interpreter only.
      - framework: build/lib/flycast_libretro_ios.dylib
        embed: true
        link: false
        codeSign: false
      # Symbian / N-Gage, Continuum Symbian (EKA2L1, dyncom interpreter), built from source.
      - framework: build/lib/continuum_symbian_libretro_ios.dylib
        embed: true
        link: false
        codeSign: false
      # The JIT builds (scripts/build-core.sh, "THE JIT BUILDS"): loaded only when JIT is on.
      - framework: build/lib/pcsx_rearmed_jit_libretro_ios.dylib
        embed: true
        link: false
        codeSign: false
      - framework: build/lib/parallel_n64_jit_libretro_ios.dylib
        embed: true
        link: false
        codeSign: false
      - framework: build/lib/flycast_jit_libretro_ios.dylib
        embed: true
        link: false
        codeSign: false
      # From the libretro iOS buildbot.
      - framework: build/lib/mednafen_wswan_libretro_ios.dylib
        embed: true
        link: false
        codeSign: false
      - framework: build/lib/mednafen_ngp_libretro_ios.dylib
        embed: true
        link: false
        codeSign: false
      - framework: build/lib/mednafen_pce_libretro_ios.dylib
        embed: true
        link: false
        codeSign: false
      - framework: build/lib/mednafen_supergrafx_libretro_ios.dylib
        embed: true
        link: false
        codeSign: false
      - framework: build/lib/puae_libretro_ios.dylib
        embed: true
        link: false
        codeSign: false
      - framework: build/lib/vice_x64sc_libretro_ios.dylib
        embed: true
        link: false
        codeSign: false
      - framework: build/lib/dosbox_pure_libretro_ios.dylib
        embed: true
        link: false
        codeSign: false
      - framework: build/lib/prboom_libretro_ios.dylib
        embed: true
        link: false
        codeSign: false
      - framework: build/lib/virtualjaguar_libretro_ios.dylib
        embed: true
        link: false
        codeSign: false
      - framework: build/lib/handy_libretro_ios.dylib
        embed: true
        link: false
        codeSign: false
      - framework: build/lib/prosystem_libretro_ios.dylib
        embed: true
        link: false
        codeSign: false
      - framework: build/lib/a5200_libretro_ios.dylib
        embed: true
        link: false
        codeSign: false
      - framework: build/lib/fbneo_libretro_ios.dylib
        embed: true
        link: false
        codeSign: false
      - framework: build/lib/mesen2_libretro_ios.dylib
        embed: true
        link: false
        codeSign: false
      - framework: build/lib/mame2003_plus_libretro_ios.dylib
        embed: true
        link: false
        codeSign: false
      - framework: build/lib/pokemini_libretro_ios.dylib
        embed: true
        link: false
        codeSign: false
      - framework: build/lib/mednafen_vb_libretro_ios.dylib
        embed: true
        link: false
        codeSign: false
      - framework: build/lib/yabause_libretro_ios.dylib
        embed: true
        link: false
        codeSign: false
      - framework: build/lib/mednafen_saturn_libretro_ios.dylib
        embed: true
        link: false
        codeSign: false
      - framework: build/lib/picodrive_libretro_ios.dylib
        embed: true
        link: false
        codeSign: false
      # MoltenVK: Vulkan on Metal, and the gate on every hardware rendered system. Embedded but
      # NOT LINKED, deliberately. It is reached by `dlopen` from vulkan_probe.rs so that a missing
      # or broken MoltenVK is a line on the diagnostics panel rather than an app that will not
      # launch. Fetched by scripts/fetch-moltenvk.sh, which package-ipa.sh runs before generating.
      - framework: build/lib/MoltenVK.framework
        embed: true
        link: false
        codeSign: false

# Declared explicitly. XcodeGen only emits a *shared* scheme when one is defined here, and
# `xcodebuild -scheme` cannot see the non-shared schemes Xcode would otherwise invent on
# first open, which fails on a CI runner that never opens the project.
schemes:
  Continuum:
    build:
      targets:
        Continuum: all
    run:
      config: Release
    archive:
      config: Release
