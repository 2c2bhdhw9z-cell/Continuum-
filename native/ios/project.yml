# XcodeGen input. `xcodegen generate` turns this into Continuum.xcodeproj.
#
# Generated rather than committed, because a .xcodeproj is a UUID-keyed property list that
# cannot be reviewed in a diff or edited safely without Xcode, and nobody on this project
# has Xcode. YAML that a tool expands is auditable; the pbxproj it expands into, many times
# the size, is not. The generated project is gitignored.
#
# Paths are relative to this file (native/ios).

name: Continuum
options:
  bundleIdPrefix: dev.continuum
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  # Nothing here is signed by Xcode. The .ipa is signed ad-hoc afterwards and then again by
  # TrollStore on the device; see package-ipa.sh.
  defaultConfig: Release

settings:
  base:
    SWIFT_VERSION: "5.0"
    ONLY_ACTIVE_ARCH: NO
    ARCHS: arm64
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGN_IDENTITY: ""
    ENABLE_BITCODE: NO
    # CODE_SIGN_ENTITLEMENTS is deliberately *not* set. Signing is disabled for this build,
    # so Xcode would either ignore the key or fail on it; package-ipa.sh attaches
    # Continuum.entitlements with `codesign --entitlements` afterwards, which is the step
    # that actually has to embed them for TrollStore to preserve.
    # dlopen of Frameworks/libcontinuum_switch.dylib resolves through this. Without it the
    # load works in the simulator (which searches differently) and fails on device.
    LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"

# SMB is libsmb2, built by scripts/fetch-libsmb2.sh into build/smb and linked into the app.
# It is a static library, not a framework. Build 117 died on launch because AMSMB2.framework was
# linked and never embedded. A static library cannot fail that way: there is nothing to embed.
# The script runs before xcodegen, same as MoltenVK, because the header search path below has to
# exist when the project is generated and when smb_min.c is compiled.

targets:
  Continuum:
    type: application
    platform: iOS
    info:
      path: Info.plist
      # XcodeGen GENERATES this Info.plist on every `xcodegen generate`: the emitted plist is
      # a fixed set of auto-default keys (CFBundleIdentifier, CFBundleName,
      # CFBundleDevelopmentRegion, CFBundleExecutable, CFBundleInfoDictionaryVersion,
      # CFBundlePackageType, and CFBundleShortVersionString=1.0 / CFBundleVersion=1) MERGED
      # with the keys below, and the on-disk Info.plist is OVERWRITTEN if it differs (see
      # XcodeGen Sources/XcodeGenKit/FileWriter.swift writePlists + InfoPlistGenerator.swift).
      # It does NOT read the committed Info.plist content. So every custom key the app needs
      # must be declared here or it is dropped from the built app. The committed Info.plist is
      # only a human-readable seed kept in sync by hand.
      properties:
        # Multi-file cue/bin support (Option 2): expose the app's Documents directory in the
        # Files app / Finder and allow opening documents in place, so a user can drag a folder
        # of .cue + .bin tracks straight into Documents (inside the sandbox, no security scope
        # needed) as an alternative to the folder picker.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # Custom keys carried over from the seed Info.plist. CFBundleShortVersionString and
        # CFBundleVersion MUST be restated because the XcodeGen auto-defaults are 1.0 / 1.
        #
        # CFBundleVersion IS REWRITTEN BY package-ipa.sh BEFORE THIS FILE IS READ, and the literal
        # below is only the fallback for a build with no number to stamp. It used to be a permanent
        # "1", which meant every build this project ever produced was version 0.8.0 (1) under the
        # same bundle id. An installer decides whether an .ipa is an upgrade from exactly that
        # number, so a new build looked to iOS like the copy already installed and the install was
        # skipped: signing succeeded, the installer reported success, and the app did not change.
        # Diagnosing that cost an evening, because every symptom pointed at the app rather than at
        # the installer declining to replace it.
        CFBundleDisplayName: Continuum
        CFBundleShortVersionString: "0.8.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        MinimumOSVersion: "16.0"
        UIRequiredDeviceCapabilities:
          - arm64
          - metal
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        # The permission prompts for the microphone and the camera (Peripherals.swift). iOS
        # terminates an app that touches either without its key, so these are not optional. Asked
        # only when a running game opens the microphone or starts the camera, and only when the
        # matching switch in Settings is on.
        NSMicrophoneUsageDescription: "Games that listen, such as 3DS games you blow into, can hear the microphone while you play. Only used when Allow microphone in games is on."
        NSCameraUsageDescription: "Games that use a camera, such as 3DS camera games, can see the camera while you play. Only used when Allow camera in games is on."
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        # Online play (Netplay.swift): the host listens on the local network and advertises over
        # Bonjour, and the guest browses for it. iOS shows this sentence in the Local Network
        # permission prompt, and refuses to browse a service type not listed below.
        # Also covers Wi-Fi transfer (WiFiTransfer.swift) and WebDAV browsing (RemoteSources.swift;
        # SMB is not in this build).
        NSLocalNetworkUsageDescription: "Continuum uses the local network for two-player online play with another phone, for Wi-Fi transfer of games and saves from a computer's browser, and to browse a NAS or computer over WebDAV."
        NSBonjourServices:
          - _continuum._tcp
        # Open in / Share to Continuum (ImportCenter.open): every game, disc, skin, cheat and save
        # extension, plus zip, 7z, iso and PDF manuals through the system's own types. Alternate rank,
        # so Continuum is offered without taking over any file type. `.md`, `.bin`, `.img`, `.exe` and
        # `.crt` are left out: iOS already owns those extensions for other kinds of file, so declaring
        # them would be ignored; they still come in through the picker, Wi-Fi and the network.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Game cartridge
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - dev.continuum.game-rom
          - CFBundleTypeName: Game disc image
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - dev.continuum.disc-image
          - CFBundleTypeName: Controller skin
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - dev.continuum.skin
          - CFBundleTypeName: Cheat list
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - dev.continuum.cheat
          - CFBundleTypeName: Game save
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - dev.continuum.save
          - CFBundleTypeName: Archive, disc or manual
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.zip-archive
              - org.7-zip.7-zip-archive
              - public.iso-image
              - com.adobe.pdf
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: dev.continuum.game-rom
            UTTypeDescription: Game cartridge
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - "nes"
                - "unf"
                - "unif"
                - "fds"
