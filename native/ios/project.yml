# XcodeGen input. `xcodegen generate` turns this into Continuum.xcodeproj.
#
# Generated rather than committed, because a .xcodeproj is a UUID-keyed property list that
# cannot be reviewed in a diff or edited safely without Xcode, and nobody on this project
# has Xcode. Forty lines of YAML that a tool expands is auditable; 400 lines of pbxproj is
# not. The generated project is gitignored.
#
# Paths are relative to this file (native/ios).

name: Continuum
options:
  bundleIdPrefix: dev.continuum
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  # Nothing here is signed by Xcode. The .ipa is signed ad-hoc afterwards and then again by
  # TrollStore on the device; see package-ipa.sh.
  defaultConfig: Release

settings:
  base:
    SWIFT_VERSION: "5.0"
    ONLY_ACTIVE_ARCH: NO
    ARCHS: arm64
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGN_IDENTITY: ""
    ENABLE_BITCODE: NO
    # CODE_SIGN_ENTITLEMENTS is deliberately *not* set. Signing is disabled for this build,
    # so Xcode would either ignore the key or fail on it; package-ipa.sh attaches
    # Continuum.entitlements with `codesign --entitlements` afterwards, which is the step
    # that actually has to embed them for TrollStore to preserve.
    # dlopen of Frameworks/libcontinuum_switch.dylib resolves through this. Without it the
    # load works in the simulator (which searches differently) and fails on device.
    LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"

targets:
  Continuum:
    type: application
    platform: iOS
    info:
      path: Info.plist
      # XcodeGen GENERATES this Info.plist on every `xcodegen generate`: the emitted plist is
      # a fixed set of auto-default keys (CFBundleIdentifier, CFBundleName,
      # CFBundleDevelopmentRegion, CFBundleExecutable, CFBundleInfoDictionaryVersion,
      # CFBundlePackageType, and CFBundleShortVersionString=1.0 / CFBundleVersion=1) MERGED
      # with the keys below, and the on-disk Info.plist is OVERWRITTEN if it differs (see
      # XcodeGen Sources/XcodeGenKit/FileWriter.swift writePlists + InfoPlistGenerator.swift).
      # It does NOT read the committed Info.plist content. So every custom key the app needs
      # must be declared here or it is dropped from the built app. The committed Info.plist is
      # only a human-readable seed kept in sync by hand.
      properties:
        # Multi-file cue/bin support (Option 2): expose the app's Documents directory in the
        # Files app / Finder and allow opening documents in place, so a user can drag a folder
        # of .cue + .bin tracks straight into Documents (inside the sandbox, no security scope
        # needed) as an alternative to the folder picker.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # Custom keys carried over from the seed Info.plist. CFBundleShortVersionString and
        # CFBundleVersion MUST be restated because the XcodeGen auto-defaults are 1.0 / 1 and
        # the app ships 0.8.0 / 1.
        CFBundleDisplayName: Continuum
        CFBundleShortVersionString: "0.8.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        MinimumOSVersion: "16.0"
        UIRequiredDeviceCapabilities:
          - arm64
          - metal
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    # EVERY SWIFT FILE THE APP NEEDS MUST BE LISTED HERE, BY NAME. This list is explicit, not a
    # directory glob, so a new file that is not added below is simply never compiled: the app
    # builds, installs and launches, and the feature in that file does not exist, with no error
    # anywhere to read. Adding a file to native/ios/ and forgetting this line is therefore a silent
    # failure, which is the worst kind on a build whose only debugger is the on-screen HUD.
    sources:
      - path: ContinuumApp.swift
      - path: MetalCanvas.swift
      # Sound. The AVAudioSession and AVAudioEngine graph, and the lock-free single-producer
      # single-consumer ring between the display link that drains the engine and the render block
      # that plays it. IF THIS LINE GOES MISSING THE APP IS SILENT AND NOTHING SAYS WHY, which is
      # exactly the failure the comment above this list is about.
      - path: AudioOutput.swift
      # The on-screen pad: the engine's button wire format, the per-system control sets, and the
      # multi-touch surface that tracks the D-pad as one region so diagonals resolve. It also holds
      # TouchLayout, the six persisted numbers the editor below writes.
      - path: TouchControls.swift
      # Physical controllers: MFi, Xbox, DualShock and DualSense through GameController. The
      # connect and disconnect observers, the per frame poll the display link reads, and the
      # translation into the engine's W3C button order. It writes the engine's GAMEPAD input layer
      # while TouchControls.swift writes the TOUCH layer, which is what lets both be used at once.
      # WITHOUT THIS LINE nothing in it is compiled, and for once that fails loudly rather than
      # silently: ContinuumApp, MetalCanvas, PlayerScreen and SettingsScreen all name types from it,
      # so the build breaks in four other files instead of shipping an app that quietly ignores
      # every controller. That is luck rather than a safety net, and it is not a reason to leave the
      # line out. The GameController framework itself needs no entry here, because Swift autolinks
      # what it imports; AVFoundation in AudioOutput.swift is listed nowhere either.
      - path: PhysicalControllers.swift
      # The layout editor: the full-screen screen that moves the on-screen controls. It mounts the
      # REAL pad in edit mode rather than a drawing of one, so what is dragged is what a game gets.
      # Without this line the button in Settings has nothing to open and the layout is fixed again,
      # with nothing anywhere to say why.
      - path: TouchLayoutEditor.swift
      # The player screen's chrome, and the diagnostics panel both screens share.
      - path: PlayerScreen.swift
      # Stage 2, the library shell. The tab shell, the top bar, the hero and the shelves.
      - path: LibraryShell.swift
      # The pieces the shell is built from: hero, cards, list rows, palette, status tint.
      - path: LibraryCards.swift
      # Settings: the artwork controls and their disclosure, the layout controls, the permanent home
      # of the diagnostics, the BIOS row and the core options.
      - path: SettingsScreen.swift
      # The five emulation preferences (fit, filter, fast-forward multiplier, volume, rewind
      # budget), their storage keys, and the re-assertion into an engine whose frame pacer is
      # rebuilt by every launch. Without this file the picture, sound and speed controls in
      # Settings do not exist and the player has no rewind or fast-forward button.
      - path: EmulationSettings.swift
      # One game's detail sheet: the facts, the artwork actions and delete.
      - path: GameDetailSheet.swift
      # Cover art, the pure half: the libretro playlist directory names, the filename to
      # thumbnail-name transform, the candidate ladder and the procedural plate.
      - path: GameArtwork.swift
      # Cover art, the working half: URLSession fetching capped at three at a time, the on-disk
      # store outside Documents, the one-week negative cache and the user-picked image.
      - path: ArtworkStore.swift
      # Cover art, the last rung: the server's own directory listings, one per system AND folder,
      # parsed once each and kept for thirty days, so a game named under a convention this app
      # cannot derive still gets its cover. The match is an equality of normalised titles, and after
      # that a whole-word prefix or suffix alignment with hard guards, which is what finds a cover
      # filed without the game's series name. Never a substring and never a distance, and an
      # alignment that hits two titles picks nothing at all.
      - path: ArtworkIndex.swift
      # Cover art, the choice: every cover the server has for one game, enumerated only when that
      # game's detail card is opened, offered as labelled thumbnails, and remembered against the
      # entry so a chosen cover outranks anything automatic resolution would pick. Nothing in here
      # runs while the library is being browsed. It also holds ArtworkChoice, the record that makes a
      # chosen, picked or CAPTURED cover survive a relaunch and a re-scan.
      - path: ArtworkChooser.swift
      # Cover art, the tier that asks nobody: one frame captured from the running game, turned into
      # the PNG the store keeps. The stride, the byte order and the meaning of the alpha byte all live
      # in here, and every one of them fails by producing a WRONG PICTURE rather than an error, which
      # is why the arithmetic is split off from the CoreGraphics call and checked on the build host.
      # WITHOUT THIS LINE the build breaks in ArtworkStore.swift, which names CapturedCover, so this
      # is one of the few files whose absence is loud. That is luck rather than a safety net: the
      # feature it carries is the last artwork tier, and it is the only one that works for a ROM no
      # cover database has ever heard of.
      - path: FrameCapture.swift
      # What a filename can honestly be made to say: the display title and the region.
      - path: GameMetadata.swift
      # Save states: the metadata index, the payload files in Application Support, the auto-save
      # written when a game is left or the app is put away, the resume on launch, and the four-check
      # gate that refuses to hand a core a state another build wrote. WITHOUT THIS LINE the app
      # still builds and every reference to it fails in four other files, which is luck rather than
      # a safety net: ContinuumApp, PlayerScreen, GameDetailSheet and SettingsScreen all name types
      # from it. The gate is the part that must never be quietly dropped, because the failure it
      # prevents is a core accepting a foreign state and corrupting itself minutes later.
      - path: SaveStates.swift
      # Cheats: the durable per-game code lists, and the one path that pushes a list into the
      # resident core as a whole and in order. Separate from SaveStates.swift because a cheat is
      # text the user typed and a state is an opaque blob a core wrote, and only one of those two
      # can corrupt a session.
      - path: CheatStore.swift
      # The UniFFI-generated Swift facade. Written by build-engine.sh, never committed: a
      # stale checked-in binding that disagrees with the Rust compiles, links, and then
      # corrupts arguments at runtime, which is the worst failure mode in this stack.
      - path: build/Generated
        includes:
          - "*.swift"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.continuum.app
        PRODUCT_NAME: Continuum
        # The C header + modulemap UniFFI generated next to the Swift. The modulemap is
        # renamed to module.modulemap by build-engine.sh so clang finds it by directory.
        SWIFT_INCLUDE_PATHS: "$(SRCROOT)/build/Generated"
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/build/Generated"
        LIBRARY_SEARCH_PATHS: "$(inherited) $(SRCROOT)/build/lib"
        OTHER_LDFLAGS: "$(inherited) -lemulator_bridge -lc++"
    dependencies:
      # The C++ libretro wrapper, dlopened at runtime rather than linked. `embed` puts it in
      # Frameworks/; `codeSign: false` because package-ipa.sh signs everything in one pass
      # after the fact, and letting Xcode try would fail with signing disabled.
      - framework: build/lib/libcontinuum_switch.dylib
        embed: true
        # Copied into Frameworks/ but *not* linked. The engine reaches it through dlopen in
        # load_native_core, which is the whole point of a core being loadable at runtime. If
        # it were linked as well, a wrong rpath would stop the app launching at all instead
        # of surfacing "libcontinuum_switch.dylib is missing" in the HUD.
        link: false
        codeSign: false
      # The real libretro cores. Same shape as the wrapper above and for the same
      # reason: each is dlopened at runtime from Frameworks/ (a real ROM path, need_fullpath
      # for the CD cores) and never linked. `embed` puts them in Frameworks/; package-ipa.sh
      # signs everything in one pass after the fact, so `codeSign: false` keeps Xcode from
      # failing with signing disabled.
      #
      # These filenames are produced and staged by scripts/build-core.sh, which is where they
      # are defined; they must match it byte for byte, along with package-ipa.sh's embed
      # fallback, the "Verify the .ipa" greps in .github/workflows/ios.yml and CoreCatalog in
      # ContinuumApp.swift. Nothing in Xcode will tell you when one of them is wrong: the app
      # builds, installs, launches, and then cannot find a core.
      - framework: build/lib/fceumm_libretro_ios.dylib
        embed: true
        link: false
        codeSign: false
      - framework: build/lib/mgba_libretro_ios.dylib
        embed: true
        link: false
        codeSign: false
      - framework: build/lib/genesis_plus_gx_libretro_ios.dylib
        embed: true
        link: false
        codeSign: false
      - framework: build/lib/snes9x_libretro_ios.dylib
        embed: true
        link: false
        codeSign: false
      - framework: build/lib/pcsx_rearmed_libretro_ios.dylib
        embed: true
        link: false
        codeSign: false
      # Nintendo DS. Software renderer, so it needs nothing the other five do not: see the note in
      # scripts/build-core.sh ios_core_config for why this core arrives before the N64.
      - framework: build/lib/melonds_libretro_ios.dylib
        embed: true
        link: false
        codeSign: false
      # TurboGrafx-16 and Atari 2600. Both software renderers, and both reached by reading what
      # each core declares rather than by adding anything to the graphics path.
      - framework: build/lib/mednafen_pce_fast_libretro_ios.dylib
        embed: true
        link: false
        codeSign: false
      - framework: build/lib/stella2023_libretro_ios.dylib
        embed: true
        link: false
        codeSign: false
      # Nintendo 64, software rasteriser and interpreter. Needs neither MoltenVK nor JIT; see
      # scripts/build-core.sh ios_core_config and docs/PLATFORM_LIMITS.md.
      - framework: build/lib/parallel_n64_libretro_ios.dylib
        embed: true
        link: false
        codeSign: false

# Declared explicitly. XcodeGen only emits a *shared* scheme when one is defined here, and
# `xcodebuild -scheme` cannot see the non-shared schemes Xcode would otherwise invent on
# first open, which fails on a CI runner that never opens the project.
schemes:
  Continuum:
    build:
      targets:
        Continuum: all
    run:
      config: Release
    archive:
      config: Release
