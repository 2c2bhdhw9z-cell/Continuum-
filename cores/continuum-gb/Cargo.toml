# Continuum GB: this project's own Game Boy core, written from scratch, exposed as a libretro core.
# A standalone crate (its own empty [workspace]) so it builds and tests without the app's engine.
# A change here starts the iOS workflow (cores/continuum-gb/** is in its push paths), and the
# .ipa build compiles it from source every time (scripts/build-core.sh, continuum_gb).
[package]
name = "continuum_gb"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
libc = "0.2"

[dev-dependencies]
png = "0.17"

[profile.test]
opt-level = 2

[workspace]
