# cArcade (crate continuum_arcade): Continuum's own arcade emulator, written from scratch, to be
# exposed as a libretro core (.kiro/notes/docs/ARCADE_CORE.md). A standalone crate (its own empty [workspace])
# like cores/continuum-gb, so it builds and tests without the app's engine. Pure Rust, no C.
[package]
name = "continuum_arcade"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
bincode = "1.3"

[dev-dependencies]
# Reads SingleStepTests' Z80 suite (JSON) in tests/z80_singlestep.rs. Tests only.
serde_json = "1"
# Reads MAME's snapshots in tests/pacman_mame.rs (the version cBoy's tests use). Tests only.
png = "0.17"
# A real deflater, to check cArcade's own inflater against (src/zip.rs). Tests only; already
# in the lock file through png.
flate2 = "1"

[profile.test]
opt-level = 2

[workspace]
