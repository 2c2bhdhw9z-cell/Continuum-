# Continuum's own GameCube and Wii emulator (working name continuum-gc; the player-facing name is
# not chosen yet). Written from scratch in Rust like cores/continuum-gb (cBoy) and
# cores/continuum-arcade (cArcade), exposed as a libretro core. A standalone crate (its own empty
# [workspace]) so it builds and tests without the app's engine.
#
# No other emulator's code goes in (no Dolphin, no wrapper). Ordinary libraries are fine
# (owner, 23 October 2026: "whatever libraries, just no FULL cores").
[package]
name = "continuum_gc"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
bincode = "1.3"

# Runs the JIT's ARM64 code on the x86 test machine (the `unicorn` feature: tests and the
# comparison tools only, never in the core).
unicorn-engine = { version = "2.1", default-features = false, features = ["arch_aarch64"], optional = true }

[features]
unicorn = ["dep:unicorn-engine"]

[dev-dependencies]
bincode = "1.3"

# Development profiler for examples/profile.rs (x86 test machine only, not in the core).
[target.'cfg(target_arch = "x86_64")'.dev-dependencies]
pprof = { version = "0.14", default-features = false, features = ["cpp"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

# For examples/profile.rs: release speed with line information for the profiler.
[profile.profiling]
inherits = "release"
debug = 1

[profile.test]
opt-level = 2

[workspace]
