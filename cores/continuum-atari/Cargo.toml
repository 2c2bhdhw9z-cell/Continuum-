# cAtari (crate continuum_atari): Continuum's own Atari 7800 emulator, written from scratch, to be
# exposed as a libretro core (.kiro/notes/tasks/atari7800.json; the settings it has are in
# .kiro/notes/docs/A7800_OPTIONS_INVENTORY.md). A standalone crate (its own empty [workspace]) like
# cores/continuum-gb and cores/continuum-sms, so it builds and tests without the app's engine. Pure
# Rust, no C. Its 6502 (src/m6502.rs) is our own too, proven on SingleStepTests' suite.
[package]
name = "continuum_atari"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
bincode = "1.3"

[dev-dependencies]
# Reads SingleStepTests' 6502 suite (JSON) in tests/m6502_singlestep.rs. Tests only.
serde_json = "1"
# Reads MAME's snapshots and writes pictures of test programs. Tests only.
png = "0.17"

[profile.test]
opt-level = 2

[workspace]
