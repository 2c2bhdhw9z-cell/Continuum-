[package]
name = "emulator-bridge"
description = "Interface-agnostic emulator manager/engine layer. Builds for native ARM64 (iOS) and for the host, where the test suite runs."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
# cdylib -> the dylib UniFFI reads metadata out of. Its library mode accepts only
#           .so/.dll/.dylib and never .a, so the staticlib cannot serve that purpose, which
#           is the whole reason this entry outlived the wasm build that introduced it.
# staticlib -> what Xcode links into the .app.
# rlib -> host unit tests.
crate-type = ["cdylib", "rlib", "staticlib"]

[dependencies]
bytemuck = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }
wgpu = { workspace = true, features = [
  "std",
  "metal",
  "vulkan",
  "wgsl",
  "parking_lot",
] }
# Optional so the host test suite builds neither of them. `libloading` is how a real core is
# loaded and `uniffi` is how Swift reaches the engine, and a test run needs neither.
libloading = { version = "0.8", optional = true }
uniffi = { version = "0.28", optional = true }

# --- Apple targets only (iOS device, and macOS for binding generation). ---
[target.'cfg(target_vendor = "apple")'.dependencies]
# `Renderer::from_surface` is async because `request_adapter`/`request_device` are. On Metal
# they resolve without pending, and `attach_metal` is called synchronously from
# `layoutSubviews`, so the future is driven here rather than making the whole UniFFI surface
# async. pollster is the smallest correct way to do that: no dependencies of its own.
pollster = "0.4"

[features]
default = []
# Load a libretro core from a shared library (`cores/native_core.rs`).
native-core = ["dep:libloading"]
# The Swift-facing facade (`uniffi_api.rs`).
uniffi-bindings = ["dep:uniffi"]
