[workspace]
members = ["crates/emulator-bridge", "crates/uniffi-bindgen"]
# The engine is what `cargo build`/`cargo test` with no `-p` should mean. The binding
# generator is a build-time tool for the iOS pipeline, built explicitly by
# `native/ios/build-engine.sh`, and keeping it out of the default set means the web CI does
# not compile clap to deploy a PWA.
default-members = ["crates/emulator-bridge"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
# Backends are selected per target in the crate manifests: WebGPU only for wasm,
# Metal for iOS. Enabling them here would compile a WebGL2 fallback we explicitly
# do not want.
wgpu = { version = "30.0", default-features = false }
bytemuck = { version = "1", features = ["derive"] }
log = "0.4"
thiserror = "2"
raw-window-handle = "0.6"


[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

# The iOS engine profile. Identical to release except that panics unwind instead of
# aborting. `panic = "abort"` takes the process down on a Rust panic, which throws away the
# `rustPanic` case UniFFI generates and the HUD relies on to say *why* a session died; on a
# sideloaded build with no debugger that error message is the only diagnostic there is.
# Unwinding lets the panic cross the FFI boundary as a Swift error instead.
#
# This is a *separate* profile rather than a change to `[profile.release]` on purpose:
# `cargo test` uses release and wants `panic = "abort"` left alone, and a panic that aborts
# is the right behaviour everywhere except across the Swift boundary, where the process would
# die instead of reporting. Only native/ios/build-engine.sh builds
# with `--profile ios`, so only the iOS engine unwinds. Custom profiles write their
# artefacts to `target/<triple>/ios/`, so build-engine.sh reads from there rather than
# `.../release/`.
[profile.ios]
inherits = "release"
panic = "unwind"

# Emulator cores are latency-sensitive; never ship a debug-speed core.
[profile.dev.package."*"]
opt-level = 2
